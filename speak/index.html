let inStudy=null;
function enterStudy(id){inStudy=STUDIES.find(s=>s.id===id);inUnit=null;idx=-1;renderLearn();window.scrollTo(0,0)}
function exitStudy(){inStudy=null;renderLearn();window.scrollTo(0,0)}
function studiesSection(){
  if(!STUDIES.length)return '';
  return `<div style="margin:24px 0 4px;font-family:var(--serif);font-size:17px;color:var(--wood-dk)">Speech Studies · 精读</div>
  <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">One great speech, read whole — structure, beats, what to steal.</div>`+
  STUDIES.map(st=>`<div class="unit" onclick="enterStudy('${st.id}')">
    <div class="badge">§</div>
    <div><div class="ut">${esc(st.title)}</div><div class="um">${esc(st.sub)}</div></div>
    <div class="prog">${st.beats.length} beats</div>
  </div>`).join('');
}
function renderStudy(){
  const st=inStudy, area=document.getElementById('learnArea');
  area.innerHTML=`<div class="card">
    <span class="cat-chip">Speech Study · 精读</span>
    <div class="term" style="font-size:22px">${esc(st.title)}</div>
    <div style="font-size:13px;color:var(--muted);margin-top:2px">${esc(st.sub)}</div>
    <div class="blk"><span class="lbl">The whole in one look · 全篇一眼</span>${esc(st.intro)}<div class="whyzh">${esc(st.introzh)}</div></div>
    <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">${st.beats.map((b,i)=>`<button class="btn ghost slim" onclick="document.getElementById('bt${i}').scrollIntoView({behavior:'smooth'})">${i+1} ${esc(b.fnzh)}</button>`).join('')}</div>
  </div>`+
  st.beats.map((b,i)=>`<div class="card" id="bt${i}" style="margin-top:14px">
    <span class="cat-chip">Beat ${i+1} / ${st.beats.length} · ${esc(b.fn)} · ${esc(b.fnzh)}</span>
    <div class="quote" style="margin-top:10px"><span class="q">“${esc(b.quote)}”</span><span class="src">— ${esc(st.speaker||'')} · <a href="${b.url}" target="_blank" style="color:var(--green);text-decoration:none">${b.exact?'▶':'↗'}</a></span></div>
    <div class="blk"><span class="lbl">Craft · 手法</span>${esc(b.craft)}<div class="whyzh">${esc(b.craftzh)}</div></div>
    ${b.steal?`<div class="blk"><span class="lbl">Steal this · 拿走就用</span>${esc(b.steal)}</div>`:''}
  </div>`).join('')+
  `<div class="card" style="margin-top:14px">
    <span class="cat-chip">The arc · 全篇弧线</span>
    <div class="blk" style="margin-top:6px">${esc(st.arc)}<div class="whyzh">${esc(st.arczh)}</div></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost slim" onclick="exitStudy()">⌂ All studies</button><button class="btn ghost slim" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Top</button></div>
  </div>`;
}

/* ============ LEARN ============ */
let inUnit=null, idx=-1;
function pickupCards(){return UNITS.find(x=>x.id==='uP')? PICKUPS.concat(state.custom.map(c=>({id:c.id,term:c.term,cat:c.cat||'Words',gloss:c.meaning||'',hard:[],quote:c.example||'',src:(c.gift?'From '+c.gift+' 🎁'+(c.source?' · '+c.source:''):c.source||''),why:c.why||'',whyzh:c.whyzh||'',usage:c.usage||[],_cus:true}))) : [];}
function unitWords(u){return u.id==='uP'? pickupCards() : u.words;}
function unitLearnedCount(u){return unitWords(u).filter(w=>w._cus?true:ws(w.id).learned).length}
function unitDone(u){return unitLearnedCount(u)===unitWords(u).length}
function unitUnlocked(i){return true}

function renderLearn(){
  const area=document.getElementById('learnArea');
  if(inStudy){renderStudy();return;}
  if(!inUnit){
    const MAIN=UNITS.filter(u=>!u.tool), TOOLS=UNITS.filter(u=>u.tool);
    const cont=MAIN.find(u=>!unitDone(u)&&unitLearnedCount(u)>0)||MAIN.find(u=>!unitDone(u));
    const hero=cont?`<div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:12px;cursor:pointer" onclick="enterUnit('${cont.id}')"><div style="font-size:26px">▶</div><div><div style="font-weight:700">Continue: ${esc(cont.title)}</div><div style="font-size:12.5px;color:var(--muted)">${unitLearnedCount(cont)}/${unitWords(cont).length} · pick up where you left off</div></div></div>`:'';
    area.innerHTML=hero+MAIN.map((u,i)=>{
      const done=unitDone(u),n=unitLearnedCount(u);
      const cls=done?'done':(n>0?'active':'');
      const icon=done?'✓':(i+1);
      return `<div class="unit ${cls}" onclick="enterUnit('${u.id}')">
        <div class="badge">${icon}</div>
        <div><div class="ut">${esc(u.title)}${u.zh?` <span class="uz">· ${esc(u.zh)}</span>`:''}</div><div class="um">${esc(u.from)} · ${unitWords(u).length}${u.deck?' in stock · 20 random per visit':' entries'}</div></div>
        <div class="prog">${n}/${unitWords(u).length}</div>
      </div>`;
    }).join('')+studiesSection()+`<div style="margin:24px 0 4px;font-family:var(--serif);font-size:17px;color:var(--wood-dk)">Toolkit · 常备</div>
  <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Daily routine and your own collection — not lessons, always at hand.</div>`+TOOLS.map(u=>{
      const n=unitLearnedCount(u);
      return `<div class="unit" onclick="enterUnit('${u.id}')">
        <div class="badge">✦</div>
        <div><div class="ut">${esc(u.title)}${u.zh?` <span class="uz">· ${esc(u.zh)}</span>`:''}</div><div class="um">${esc(u.from)} · ${unitWords(u).length} entries</div></div>
        <div class="prog">${n}/${unitWords(u).length}</div>
      </div>`;
    }).join('');
    updateBadges();return;
  }
  const u=inUnit;
  if(idx===-1){
    area.innerHTML=`<div class="card">
      <span class="cat-chip">${UNITS.filter(x=>!x.tool).indexOf(u)>=0?('UNIT '+(UNITS.filter(x=>!x.tool).indexOf(u)+1)+' · '):''}${esc(u.from)}</span>
      <div class="term" style="font-size:24px">${esc(u.title)}${u.zh?`<br><span style="font-size:17px;color:var(--wood-dk)">${esc(u.zh)}</span>`:''}</div>
      <div class="blk"><span class="lbl">Why this matters</span>${u.essence}</div>
      <div class="row">
        <button class="btn ghost slim" onclick="exitUnit()">⌂ All units</button>
        <button class="btn primary" onclick="go(0)">Start →</button>
      </div></div>`;
    return;
  }
  const w=(u._sess||unitWords(u))[idx], s=w._cus?w:ws(w.id);
  area.innerHTML=`<div class="card">
     <button class="starbtn ${s.star?'on':''}" onclick="toggleStar('${w.id}')" title="focus">★</button>
     <span class="cat-chip">${esc(w.cat)}</span>
     <div class="term">${esc(w.term)}</div>
     <div class="blk"><span class="lbl">Meaning · 释义</span>${esc(w.gloss)}</div>
     ${w.hard&&w.hard.length?`<div class="blk"><span class="lbl">Word notes · 拆词</span><div class="hardw">${w.hard.map(h=>`<div><b>${esc(h[0])}</b>${PRON[h[0]]?`<span class="ipa">${PRON[h[0]]}</span>`:''}<button class="sayb" style="font-size:14px" data-w="${esc(h[0])}" onclick="sayWord(this.dataset.w)" title="pronounce">🔊</button> — ${esc(h[1])}</div>`).join('')}</div></div>`:''}
     <div class="blk"><span class="lbl">Source · 出处</span><div class="quote"><span class="q">“${esc(w.quote)}”</span><span class="src">— ${esc(srcClean(w.src))}${hasOrig(w)?' · <a href="'+origUrl(w)+'" target="_blank" style="color:var(--green);text-decoration:none">'+origLabel(w)+'</a>':''}</span></div></div>
     <div class="blk"><span class="lbl">Unpack · 解析</span>${esc(w.why)}${w.whyzh?`<div class="whyzh">${esc(w.whyzh)}</div>`:``}</div>
     <div class="blk"><span class="lbl">Usage · 用法</span><ul class="usage">${w.usage.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
     <div class="stepdots">${idx+1} / ${(u._sess||unitWords(u)).length}</div>
     <div class="row">
       <button class="btn ghost slim" onclick="exitUnit()">⌂ All units</button>
       <button class="btn ghost slim" onclick="go(${idx-1})">← Back</button>
       <button class="btn primary" onclick="learnNext()">Next →</button>
     </div></div>`;
}
function enterUnit(id){inUnit=UNITS.find(u=>u.id===id);const uw=unitWords(inUnit);
  if(inUnit.deck){const un=uw.filter(w=>w._cus?false:!ws(w.id).learned);const pool=un.length?un:uw;inUnit._sess=[...pool].sort(()=>Math.random()-.5).slice(0,20);}
  else inUnit._sess=inUnit.ordered?[...uw]:[...uw].sort(()=>Math.random()-.5);
  idx=-1;renderLearn();window.scrollTo(0,0)}
function exitUnit(){inUnit=null;idx=-1;renderLearn()}
function go(i){ if(i<-1)i=-1; idx=i; renderLearn(); window.scrollTo(0,0)}
function learnNext(){
  const u=inUnit,uw=(u._sess||unitWords(u)),w=uw[idx];
  if(!w._cus){const s=ws(w.id);if(!s.learned){s.learned=true;s.next=today();addXP(5);bumpStreak();tl().learned++;syncNow();}}
  save();
  if(idx+1<uw.length){go(idx+1);}
  else{
    const area=document.getElementById('learnArea');
    const list=UNITS.filter(x=>!x.tool), i2=list.indexOf(u), nxt=i2>=0?list[i2+1]:null;
    area.innerHTML=`<div class="card done-msg"><div class="big">${i2>=0?('Unit '+(i2+1)):esc(u.title)} complete</div>
      ${(u._sess||u.words).length} entries added to the shuffle deck.<br><br>
      <div class="row">
        <button class="btn ghost slim" onclick="exitUnit()">⌂ All units</button>
        ${nxt?`<button class="btn primary" onclick="enterUnit('${nxt.id}')">Next unit →</button>`:`<button class="btn primary" onclick="switchTo('practice')">Shuffle →</button>`}
      </div></div>`;
    updateBadges();
  }
}

/* ============ PRACTICE (session engine) ============ */
const REF_UNITS=new Set(['u0','uVm','uR','u15']);
function practicePool(){
  const cur=ALLWORDS.filter(w=>!REF_UNITS.has(w.unit)&&ws(w.id).learned).map(w=>({kind:'cur',w,s:ws(w.id)}));
  const cus=state.custom.map(c=>({kind:'cus',w:c,s:c}));
  return [...cur,...cus].filter(x=>x.s.uses<38);
}
const SESSION_SIZE=8;
let sess=null;
function exType(x){
  const u=x.s.uses||0, t=String(x.w.term);
  if(u>=4) return 'write';
  if(t.includes('→')) return 'swap';
  // cloze ONLY for real, person-attributed famous lines — never course-internal prose
  if(x.kind==='cur'&&hasOrig(x.w)){
    const qtext=(x.w.quote||'').toLowerCase();
    if(keyWord(t)&&qtext.includes(keyWord(t))) return 'cloze';
  }
  return (x.kind==='cus'&&!x.w.meaning)?'write':'recall';
}
function norm(s){return String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ').trim();}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m+n;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));}p=c;}return p[n];}
function fuzzyEq(inp,ans){inp=norm(inp);ans=norm(ans);if(!inp)return false;if(inp===ans)return true;const tol=ans.length>=8?2:(ans.length>=5?1:0);return lev(inp,ans)<=tol;}
function keyWord(t){const stop=new Set(['that','this','with','from','have','been','will','your','their','there','what','when','into','only','every','more','than','like','just']);const ws_=norm(t).split(' ').filter(w=>w.length>=4&&!stop.has(w));return (ws_.sort((a,b)=>b.length-a.length)[0])||null;}
function hintFor(w){return w?w[0]+'·'.repeat(Math.min(8,Math.max(2,w.length-1))):'';}
function blankOut(text,word){try{return text.replace(new RegExp('\\b'+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),'＿＿＿');}catch(e){return text;}}
function buildSession(forceExtra){
  const pool=practicePool(),t=today();
  let q=pool.filter(x=>x.s.next<=t);
  if(forceExtra&&!q.length)q=[...pool].sort(()=>Math.random()-.5);
  q.forEach(x=>x._r=Math.random());
  q.sort((a,b)=>(b.s.star-a.s.star)||(a.s.next-b.s.next)||(a.s.uses-b.s.uses)||(a._r-b._r));
  q=q.slice(0,SESSION_SIZE-1);
  q.forEach(x=>{x._type=exType(x);x._redone=false;});
  if(q.length>=2){const g=makeGen();q.splice(1+Math.floor(Math.random()*(q.length-1)),0,g);}
  sess={q,i:0,right:0,miss:0,extra:!!forceExtra,total:q.length};
  return q.length>0;
}

const SHUF_SCOPES=[['all','All cards'],['fam','Famous lines'],['star','Focus'],['new','New to me'],['mine','My Pickups']];

function shufAll(){
  const base=ALLWORDS.filter(w=>!REF_UNITS.has(w.unit));
  const cus=state.custom.map(c=>({id:c.id,term:c.term,cat:c.cat||'Words',gloss:c.meaning||'',hard:[],quote:c.example||'',src:(c.gift?'From '+c.gift+' 🎁'+(c.source?' · '+c.source:''):c.source||''),why:c.why||'',whyzh:c.whyzh||'',usage:c.usage||[],_cus:true,unit:'uP'}));
  return base.concat(cus);
}
function shufScope(){return state.shufScope||'all'}
function shufPool(){
  const sc=shufScope(); let p=shufAll();
  if(sc==='fam')p=p.filter(w=>hasOrig(w));
  else if(sc==='star')p=p.filter(w=>cardState(w).star);
  else if(sc==='new')p=p.filter(w=>!w._cus&&!ws(w.id).learned);
  else if(sc==='mine')p=p.filter(w=>w.unit==='uP');
  return p;
}
function setShufScope(sc){state.shufScope=sc;save();shufCur=null;shufRecent=[];renderPrac();}
function shufDraw(){
  const pool=shufPool();
  if(!pool.length){
    const msg={fam:'No famous lines in this scope yet.',star:'Nothing starred yet — tap the ★ on any card and it gathers here.',new:'Nothing new left — you have seen every card. 🎉',mine:'No pickups yet — add words with ＋ in the header.'}[shufScope()]||'No cards here yet.';
    document.getElementById('pracArea').innerHTML=`<div class="card done-msg">${msg}</div>`;return;
  }
  let cand=pool.filter(w=>!shufRecent.includes(w.id));
  if(!cand.length){shufRecent=[];cand=pool;}
  const w=cand[Math.floor(Math.random()*cand.length)];
  shufRecent.push(w.id); if(shufRecent.length>12)shufRecent.shift();
  shufCur=w;
  if(!w._cus){const s=ws(w.id); if(!s.learned){s.learned=true;s.next=today();}}

}

function makeGen(){
  const useRe=(state.reps%2===0);
  if(useRe){const p=REWRITE_PROMPTS[Math.floor(Math.random()*REWRITE_PROMPTS.length)];return {kind:'gen',gtype:'rewrite',p};}
  const pair=[MC_ADJ[Math.floor(Math.random()*MC_ADJ.length)],MC_NOUN[Math.floor(Math.random()*MC_NOUN.length)]];
  return {kind:'gen',gtype:'collide',pair};
}

function genRewriteCheck(){
  const a=(document.getElementById('genA').value||'').trim(),out=document.getElementById('genOut');
  if(!a){alert('Write your version first.');return;}
  const padded=' '+a.toLowerCase().replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ')+' ';
  const left=sess.q[sess.i].p.bad.filter(b=>padded.includes(' '+b+' '));
  if(a.split(/\s+/).length<4){out.innerHTML='<div class="tip">再长一点——保住原意,只是换掉病词。</div>';return;}
  if(left.length){out.innerHTML='<div class="tip">⚠️ 还剩病词:'+left.map(esc).map(b=>'<b>'+b+'</b>').join(' · ')+' — 再改一版(或 Skip)。</div>';return;}
  out.innerHTML='<div class="tip">✅ 病词清零 · +8 XP'+(aiReady()?' <button class="btn soft slim" style="padding:3px 9px;font-size:12px" onclick="genCoach(\'rewrite\')">🧑‍🏫 AI</button>':'')+'</div>';
  window._genLast=a;sess.right++;state.reps++;addXP(8);bumpStreak();save();
  setTimeout(()=>{sess.i++;renderItem();},1400);
}
function genCollideCheck(){
  const x=sess.q[sess.i],a=(document.getElementById('genA').value||'').trim(),out=document.getElementById('genOut');

function tryAnswer(){
  const x=sess.q[sess.i],s=x.s,c=x._ctx,out=document.getElementById('tOut');
  const inp=(document.getElementById('tIn').value||'').trim();
  if(!inp){out.innerHTML='<div class="tip">Type your answer first.</div>';return;}
  const ok=c.answers.some(a=>fuzzyEq(inp,a));
  if(ok){
    out.innerHTML=`<div class="tip">✓ <b>${esc(c.reveal)}</b></div>`;
    s.uses++;state.reps++;sess.right++;addXP(8);scheduleOK(s);bumpStreak();save();
    setTimeout(()=>{sess.i++;renderItem();},1000);
  }else{
    c.tries++;
    if(c.tries<2){out.innerHTML='<div class="tip">Not quite — one more try.</div>';document.getElementById('tIn').select&&document.getElementById('tIn').select();return;}
    out.innerHTML=`<div class="tip">Answer: <b>${esc(c.reveal)}</b></div>`;
    sess.miss++;s.next=today()+DAY;
    if(!x._redone){const clone={...x,_redone:true,_ctx:null};sess.q.push(clone);sess.total++;}
    save();
    setTimeout(()=>{sess.i++;renderItem();},1700);
  }
}

function hasOrig(w){return w&&w.quote&&w.src&&!/^BetterSpeak|worksheet|Index|canon supplement$/.test(w.src)&&!w.src.startsWith('BetterSpeak')&&!w.src.startsWith('Picked up');}
function origUrl(w){
  if(CLIPS[w.id])return CLIPS[w.id];
  const who=(w.src||'').split('—')[0].split(',')[0].replace(/[“”"]/g,'').trim();
  const snippet=toksKeep(w.quote).slice(0,8).join(' ');
  return 'https://www.youtube.com/results?search_query='+encodeURIComponent(snippet+' '+who);
}
function origLabel(w){return CLIPS[w.id]?'▶':'↗';}
function srcClean(s){
  if(!s)return s;
  s=s.replace(/;\s*on the [^;]*$/,'');
  return s.split(' — ').filter(seg=>!/^(on|from) the /i.test(seg)&&!/^canon supplement/i.test(seg)&&!/^the (Speech Bank|worksheet|course|movers)/i.test(seg)&&!/^whose closing/i.test(seg)&&!/^sampled in/i.test(seg)).join(' · ');
}
function toksKeep(t){return t.replace(/[“”]/g,'').split(/\s+/).filter(Boolean);}

async function autoFill(){

  }catch(e){alert('Auto-fill hit a snag: '+e.message+'. You can fill fields by hand.');}
  btn.textContent='✨ Auto-fill the rest';btn.disabled=false;

async function afDict(term){
  let ipa='',def='',ex='';
  try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(term));
    if(r.ok){const j=await r.json();const e0=j[0]||{};
      ipa=e0.phonetic||(((e0.phonetics||[]).find(p=>p.text)||{}).text)||'';
      const m=(e0.meanings||[])[0]||{};const d=(m.definitions||[])[0]||{};def=d.definition||'';ex=d.example||'';}
  }catch(e){}
  let zh='';
  try{const r2=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(term)+'&langpair=en|zh-CN');
    if(r2.ok){const j2=await r2.json();zh=((j2.responseData||{}).translatedText||'').trim();if(zh.toLowerCase()===term.toLowerCase())zh='';}
  }catch(e){}
  if(!def&&!zh)throw new Error('no dictionary result');
  document.getElementById('fMeaning').value=[ipa,def,zh?('— '+zh):''].filter(Boolean).join(' ');
  if(ex)document.getElementById('fExample').value=ex;
  if(!document.getElementById('fSource').value)document.getElementById('fSource').value='Auto-filled · dictionary';
}
async function afClaude(term,key){
  const body={model:'claude-haiku-4-5',max_tokens:600,messages:[{role:'user',content:'You are VocabularyGPT (per the BetterSpeak course prompts): rich vocabulary, clarity and precision, never needlessly complex. Create a vocabulary card for "'+term+'" for a Chinese-native academic training articulate English speech. Reply ONLY with JSON: {"ipa":"/…/","gloss_en":"one plain line","gloss_zh":"简洁中文释义","example":"one natural sentence (academic/professional life if apt)","source":"register note or who says this","why":"one line on why this word is worth owning","usage":["short line 1","short line 2"]}'}]};
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('API '+r.status);
  const j=await r.json();afApply(((j.content||[])[0]||{}).text||'');
}
function afApply(t){
  const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('unparseable reply');
  const c=JSON.parse(m[0]);
  document.getElementById('fMeaning').value=[c.ipa,c.gloss_en,c.gloss_zh?('— '+c.gloss_zh):''].filter(Boolean).join(' ');
  document.getElementById('fExample').value=c.example||'';
  document.getElementById('fSource').value=c.source||'AI-annotated';
  _af={why:c.why||'',usage:Array.isArray(c.usage)?c.usage.slice(0,2):[]};
}

  const pool=[...ALLWORDS.map(w=>({w,cus:false})),...pickupOnly()];
  const hits=pool.filter(x=>{const w=x.w;return (w.term+' '+(w.gloss||'')+' '+(w.quote||'')).toLowerCase().includes(q);}).slice(0,30);

  const cfg=syncCfg(); if(!SYNC_URL||!cfg||!cfg.name||!cfg.key) return;

    if(!r.ok) return;

}
function resetToday(){
  if(!confirm('Reset today — XP and today\'s counters go back to zero. Words already learned stay learned. Continue?'))return;
  state.xpNow=0;state.xpDay=today();
  state.tl={day:today(),learned:0,sessions:0,line:false};
  save();renderStreak();renderStats();
  if(currentView()==='today')renderToday();
}
function resetAll(){
  if(!confirm('Start over — erases ALL progress: learned marks, stars, XP, streak, flip counts. Your My Pickups cards are kept. This cannot be undone. Continue?'))return;
  state.words={};ALLWORDS.forEach(w=>state.words[w.id]={learned:false,star:false,uses:0,next:0});
  state.xp=0;state.xpNow=0;state.streak=0;state.lastDay=0;state.reps=0;
  state.tl={day:today(),learned:0,sessions:0,line:false};
  shufCur=null;shufRecent=[];
  save();renderStreak();renderStats();
  const v=currentView();
  if(v==='today')renderToday(); if(v==='learn'){inUnit=null;idx=-1;renderLearn();} if(v==='practice')renderPrac();
}
function currentView(){const b=document.querySelector('nav button.on');return b?b.dataset.v:'learn'}
function switchTo(v){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  ['today','learn','practice'].forEach(k=>document.getElementById('v-'+k).style.display=(k===v)?'block':'none');
  if(v==='today')renderToday(); if(v==='learn')renderLearn(); if(v==='practice')renderPrac();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.v==='learn'){inUnit=null;idx=-1;}switchTo(b.dataset.v);});


/* init */
renderToday(); renderStreak(); renderStats(); updateBadges();
syncNow(true);
</script>
</body>
