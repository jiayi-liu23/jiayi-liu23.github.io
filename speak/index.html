   quote:"If I asked you about art, you’d probably give me the skinny on every art book ever written… But I bet you can’t tell me what it smells like in the Sistine Chapel.",
   src:"Good Will Hunting (1997) — from the worksheet",
   why:"Anaphora at paragraph scale: the If-I-asked build — the scene runs three of them — each undercut by a But.",
   usage:["Pattern: If I asked you about X, you could cite Y — but could you tell me Z?","Knowledge vs experience, in one structure."]},
  {id:'u8w9',whyzh:'副歌收在每节的结尾——这是结句反复(epistrophe);每节开头的 Give thanks to… 才是首语反复。三千年的证据：重复能把听众绑在一起。',term:"for his steadfast love endures forever",cat:'Quotes',
   gloss:'每节以同一句收尾的副歌 —— 结句反复(epistrophe);句首的 Give thanks to… 才是首语反复',
   hard:[["steadfast","坚定不移的"],["endure","持续、长存"]],
   quote:"Give thanks to the Lord, for he is good, for his steadfast love endures forever. Give thanks to the God of gods… Give thanks to the Lord of lords…",
   src:"Psalm 136 — from the worksheet",
   why:'The refrain closes every verse — epistrophe, repetition at line-ends — while the openers (Give thanks to…) carry the anaphora. Three thousand years of proof that repetition binds listeners.',
   usage:["A recurring closing line can become YOUR refrain.","Note how the openers vary while the refrain holds."]},
  {id:'u8w10',whyzh:'温柔语域里的首语反复——它并不需要讲台。',term:"with each page turned…",cat:'Phrases',
   gloss:"温和的句首三连:“每翻一页……”",
   hard:[],
   quote:"With each page turned, a journey begins. With each page turned, a mind expands. With each page turned, a new world awaits.",
   src:"BetterSpeak · Rhetorical Devices worksheet",
   why:"Anaphora in a gentle register — it doesn’t need a podium.",
   usage:["With each draft, the argument sharpens. With each draft, the fat burns off.","Pattern: With each X, Y."]},
  {id:'u8w11',whyzh:'从句级首语反复：两个 the moment 从句,给一个沉重结论装弹。',term:"the moment we forget…",cat:'Quotes',
   gloss:"『当我们忘记的那一刻……当我们不再被记忆纠缠的那一刻……』",
   hard:[["haunted","被萦绕/纠缠的"]],
   quote:"The moment we forget this, the moment we cease to be haunted by its remembrance, then we become the gravediggers.",
   src:"Rod Serling — quoted in BetterSpeak Day 5",
   why:"Clause-level anaphora: two “the moment” clauses loading one grave conclusion.",
   usage:["The moment we stop checking, the moment we trust the pipeline blindly, the errors move in.","Two clauses, one payoff."]},
  {id:'u8w12',whyzh:'核心技巧：首语反复不靠预谋,靠延伸你刚说的话。自问：收句,还是复用开头？',term:"do I ask for help? do I bury my ego?",cat:'Phrases',
   gloss:"现场生成首语反复的方法：借刚出口的词,续两问",
   hard:[],
   quote:"Do I ask for help? Do I bury my ego and hand over the fishing rod? Do I risk losing my catch just to claim I caught the fish myself?",
   src:"BetterSpeak · Day 5 — the live-generation demo",
   why:"THE technique: don’t plan anaphora; extend the words you just said. Ask: finish the sentence, or reuse its opening?",
   usage:["Do I push back? Do I pick this battle? Do I let the small stuff go?","Storytelling: it pauses the action and zooms in."]},
  {id:'u8w13',whyzh:'首语反复不需要鼓点：重复的 that 从句给出一种耳朵能感到、却说不出名字的结构。',term:'that this time must be different; that their voices could be that difference',cat:'Quotes',
   gloss:"隐形的首语反复：用 that 从句悄悄重复 —— 高手的 anaphora 可以不着痕迹",
   hard:[],
   quote:"It’s the answer told by lines that stretched around schools and churches… because they believed that this time must be different; that their voices could be that difference.",
   src:"Barack Obama, election night 2008 — the worksheet’s “subtle anaphora” example",
   why:"Anaphora doesn’t need drums: repeated that-clauses give structure the ear feels but can’t name.",
   usage:["We argued that the effect was real; that it was causal; that it mattered.","Subtlety scales better in meetings than thunder."]},
  {id:'u8w14',whyzh:'史上最著名的首语反复——而且是即兴的：Mahalia Jackson 喊“讲讲那个梦！”,他离开讲稿。多年积累,恰好接住了那个时刻。',term:'eight dreams in a row',cat:'Quotes',
   gloss:"『I have a dream』连说八次 —— 世纪首语反复的结构解剖",
   hard:[],
   quote:"I have a dream that one day this nation will rise up… I have a dream that my four little children… I have a dream today!",
   src:"Martin Luther King (1963) — the delivered speech repeats the refrain eight times",
   why:"The most famous anaphora ever spoken — and it was improvised: he left the script when Mahalia Jackson called “Tell them about the dream!” Collection met the moment.",
   usage:["A refrain can hold an entire speech’s architecture.","Depth over variety: one opener, eight escalations."]},
  {id:'u8w15',ctxzh:"“我有一个梦想”收尾瀑布段的引擎:let freedom ring 十余次重复,从新罕布什尔到密西西比,一句短语扫过全国——首语反复推到极限的现场示范。",whyzh:'首语反复+地理：每次重复在新的地方插一面旗,最后一句倒装收门。',term:'let freedom ring',cat:'Quotes',
   gloss:"『让自由之声响彻……』(全篇共十次,此处节选) —— 用地名把首语反复铺成一张地图",
   hard:[],
   quote:"Let freedom ring from the prodigious hilltops of New Hampshire. Let freedom ring from the mighty mountains of New York… from every hill and molehill of Mississippi. From every mountainside, let freedom ring.",
   src:"Martin Luther King (1963) — the closing cascade",
   why:"Anaphora plus geography: each repeat plants a flag somewhere new, and the last line inverts the order to close the gate.",
   usage:["Tour your points like places: in the data… in the theory… in the field…","Invert the final repetition to signal the end."]},
  {id:'u8w16',ctxzh:"“我有一个梦想”开篇:林肯签署《解放奴隶宣言》一百年后——“一百年后的今天”连续四次落锤,黑人仍不自由。时间本身成了控诉。",whyzh:'重复即控诉：同一个世纪反复重述,直到它的重量令人无法承受。',term:'one hundred years later',cat:'Quotes',
   gloss:"『一百年后……』(全篇共四次,此处节选) —— 用同一个时间戳反复敲击",
   hard:[["manacles","镣铐"]],
   quote:"One hundred years later, the Negro still is not free. One hundred years later, the life of the Negro is still sadly crippled by the manacles of segregation…",
   src:"Martin Luther King (1963)",
   why:"Repetition as indictment: the same century restated until its weight is unbearable.",
   usage:["Audit-style anaphora: three years in… three years in… three years in…","Time-stamps repeat well; they carry built-in gravity."]},
  {id:'u8w17',whyzh:'首语反复的上限：七次重复武装了一个国家,收在唯一要紧的变奏上(never surrender)。',term:'we shall fight on the beaches',cat:'Quotes',
   gloss:"『我们将在海滩上战斗……』—— 首语反复作为国家意志",
   hard:[["surrender","投降"]],
   quote:"We shall fight on the beaches, we shall fight on the landing grounds, we shall fight in the fields and in the streets, we shall fight in the hills; we shall never surrender.",
   src:"Winston Churchill (1940) — canon supplement",
   why:"Anaphora’s upper bound: repeats that armed a nation — seven in the full passage, four shown here — closed by the one variation that matters (never surrender).",
   usage:["Vary the FINAL repeat to land the point.","Escalate locations from large to intimate — beaches to streets."]},
  {id:'u8w18',whyzh:'否定式首语反复,神圣性步步抬升,然后一转：言语做不到的,已有人用行动做到。谦卑成为结构。',term:'we can not dedicate — we can not consecrate — we can not hallow',cat:'Quotes',
   gloss:"『我们不能奉献、不能圣化、不能使之神圣』—— 三连否定的谦卑",
   hard:[["consecrate","祝圣、奉为神圣"],["hallow","使神圣(Halloween 的词根)"]],
   quote:"But, in a larger sense, we can not dedicate — we can not consecrate — we can not hallow — this ground. The brave men, living and dead, who struggled here, have consecrated it.",
   src:"Abraham Lincoln, the Gettysburg Address (1863) — canon supplement",
   why:"Negative anaphora ascending in sanctity, then the turn: others already did what words cannot. Humility as structure.",
   usage:["Pattern: we cannot X — we cannot Y — we cannot Z. Others already have.","Three synonyms ascending = one crescendo."]},
  {id:'u8w19',whyzh:'同一本书贡献了英语最著名的开头和结尾——都建在重复上。',term:'it was the best of times, it was the worst of times',cat:'Quotes',
   gloss:"『那是最好的时代,那是最坏的时代』—— 首语反复开场的祖师爷",
   hard:[["incredulity","不信、怀疑"]],
   quote:"It was the best of times, it was the worst of times, it was the age of wisdom, it was the age of foolishness, it was the epoch of belief, it was the epoch of incredulity…",
   src:"Charles Dickens, the opening of A Tale of Two Cities — whose closing line lives in Powerful Endings",
   why:"The same book supplies English’s most famous opening AND closing — both built on repetition. Anaphora opens; mirrored parallel balance closes.",
   usage:["Openers: it was the semester of X, it was the semester of Y.","Contradiction pairs held together by the same frame."]},
  {id:'u8w20',whyzh:'为呼应设计的副歌——收在每一段的结尾(结句反复),短到观众会自己接上。',term:'yes, we can',cat:'Quotes',
   gloss:"『是的,我们能』—— 三个词的副歌,人群会替你重复",
   hard:[],
   quote:"Yes, we can. Yes, we can. It was a creed written into the founding documents… Yes, we can.",
   src:"Barack Obama (2008) — the worksheet’s “subtle that” speaker at full volume",
   why:'A refrain built for call-and-response — it closes each passage (epistrophe, not anaphora), short enough that the crowd joins in.',
   usage:["Make the refrain repeatable by tired people: three words max.","A refrain the room says with you is a refrain they’ll remember as theirs."]},
 ]},
{id:'u4',title:'Powerful Endings',zh:'余音绕梁',from:'Day 6 · The Art of Ending Your Sentences · 收尾的艺术',
 essence:'Listeners remember your <b>last words</b> (recency). A weak ending — “…yeah, that’s just my opinion” — erodes everything before it. Strong speakers tie endings to <b>eternal elements</b>: earth, ocean, time, fate.<br><span style="color:var(--muted)">听众记住的是最后一句；弱结尾毁掉全部,「永恒元素」给句子分量。</span>',
 words:[
  {id:'u4w1',whyzh:'在闲聊为主的世界里,把句子系到超越此刻的事物上,它就有了分量。',term:'until the very ends of the earth',cat:'Phrases',
   gloss:'直到天涯海角 —— 用“大地的尽头”给句子收尾',
   hard:[['the ends of the earth','天涯海角(固定表达)']],
   quote:'One of the most potent phrases to end on is "until the very ends of the earth."',
   src:'BetterSpeak · on eternal elements',
   why:'In a world of small talk, tying a sentence to something beyond the moment gives it weight.',
   usage:["I'd chase this research question to the very ends of the earth.","Don't force it — no epic endings for grocery runs."]},
  {id:'u4w2',whyzh:'重复(far, far)+平行结构(better thing / better rest)——教科书式的结尾。借走这个形状。',term:'a far, far better thing',cat:'Quotes',
   gloss:'“远远更好的事” —— 重复 far 制造庄重的递进',
   hard:[['far better','比较级强化：far = 远远地,比 much better 更有文学感']],
   quote:'It is a far, far better thing that I do, than I have ever done; it is a far, far better rest that I go to than I have ever known.',
   src:'Dickens, the closing line of A Tale of Two Cities',
   why:'Repetition (far, far) + parallel structure (better thing / better rest) — a textbook ending. Borrow the shape.',
   usage:['Choosing honesty here is a far, far better thing than winning the argument.','Pattern: It is a far, far better X that… than…']},
  {id:'u4w3',whyzh:'公认最有力的结尾之一——永恒元素(船、水流、过去)加 b 头韵。',term:'boats against the current',cat:'Quotes',
   gloss:'逆流之舟 —— 被不断推回过去,仍继续向前划',
   hard:[['borne back','被推回(bear 的过去分词 borne)'],['ceaselessly','不停地(cease 停止)']],
   quote:'So we beat on, boats against the current, borne back ceaselessly into the past.',
   src:'F. Scott Fitzgerald, the closing line of The Great Gatsby',
   why:'Often ranked among the most powerful closing lines — eternal elements (boats, current, the past) plus b-alliteration.',
   usage:['Some weeks are just boats against the current.','Use sparingly — it carries real weight.']},
  {id:'u4w4',whyzh:'这个结尾之所以落地,恰因为它小——压缩就是力量。',term:'wait and hope',cat:'Quotes',
   gloss:'“等待,并心怀希望” —— 全书智慧收进两个词',
   hard:[],
   quote:'All human wisdom is summed up in these two words: Wait and hope.',
   src:'Alexandre Dumas, the closing of The Count of Monte Cristo',
   why:'The ending lands because it is tiny — compression is the power.',
   usage:['The paper is under review — nothing left to do but wait and hope.','A gentle, complete way to end an update.']},
  {id:'u4w5',whyzh:'先铺“渺小”,再用一个问句翻盘——自问自答式结尾。',term:'a multitude of drops',cat:'Quotes',
   gloss:'“沧海不过是无数水滴” —— 渺小与浩瀚互为答案',
   hard:[['multitude','大量、众多']],
   quote:'My life amounts to no more than one drop in a limitless ocean. Yet what is any ocean, but a multitude of drops?',
   src:'David Mitchell, Cloud Atlas',
   why:'Sets up smallness, then reverses it with a question — an ending that answers itself.',
   usage:['One referee report is a drop; a literature is a multitude of drops.','The turn "Yet what is any X but…" is reusable.']},
  {id:'u4w6',whyzh:'永恒元素(雪、宇宙、生者与死者)+ f 头韵+重复时 falling/faintly 换位。',term:"snow falling faintly through the universe",cat:'Quotes',
   gloss:"雪,穿过宇宙,轻轻落下 —— 收尾的天花板",
   hard:[["swoon","晕眩、失神"],["faintly","轻微地、隐约地"]],
   quote:"His soul swooned slowly as he heard the snow falling faintly through the universe and faintly falling… upon all the living and the dead.",
   src:"James Joyce, “The Dead” — closing line",
   why:"Eternal elements (snow, universe, the living and the dead) + f-alliteration + the falling/faintly swap on repeat.",
   usage:["For contemplative closes.","Note the mirrored repeat: falling faintly / faintly falling."]},
  {id:'u4w7',whyzh:'一个结尾能翻转整本书。结尾的词字字千金——要花在刀刃上。',term:"he loved Big Brother",cat:'Quotes',
   gloss:"最冷的收尾：四个词宣告彻底的失败",
   hard:[],
   quote:"But it was all right, everything was all right, the struggle was finished. He had won the victory over himself. He loved Big Brother.",
   src:"George Orwell, 1984 — closing line",
   why:"An ending can reverse the whole book. Endings carry the most weight per word — spend them deliberately.",
   usage:["Save your shortest sentence for last.","Irony lands hardest at the close."]},
  {id:'u4w8',whyzh:'收在感官而不是论断上：灰、盐、风、海——一句四个永恒元素。',term:"the salt wind from the sea",cat:'Quotes',
   gloss:"灰烬随着海上的咸风扑面而来 —— 感官收尾",
   hard:[["ashes","灰烬"]],
   quote:"And the ashes blew towards us with the salt wind from the sea.",
   src:"Daphne du Maurier, Rebecca — closing line",
   why:"Ends on senses, not statements: ash, salt, wind, sea — four eternal elements in one line.",
   usage:["Close a story on a concrete sensory image.","Say it aloud: taste the s-sounds."]},
  {id:'u4w9',whyzh:'灯光熄灭时的头韵+永恒元素——那对 d 音完成了淡出。',term:"lost in darkness and distance",cat:'Quotes',
   gloss:"消失于黑暗与远方(d 音收尾)",
   hard:[["borne away","被带走(bear 的过去分词)"]],
   quote:"He was soon borne away by the waves and lost in darkness and distance.",
   src:"Mary Shelley, Frankenstein — closing line",
   why:"Alliteration + eternal elements as the lights go out — the d-pair does the fading.",
   usage:["The question drifted off, lost in darkness and distance.","Endings love pairs: darkness and distance, dust and dreams."]},
  {id:'u4w10',whyzh:'一个动词,三个宾语,从抽象一路升到具体得让人难受。',term:"wept for the end of innocence",cat:'Quotes',
   gloss:"为纯真的终结而哭 —— 三个宾语层层加深",
   hard:[["weep/wept","哭泣(过去式 wept)"]],
   quote:"Ralph wept for the end of innocence, the darkness of man’s heart, and the fall through the air of the true, wise friend called Piggy.",
   src:"William Golding, Lord of the Flies — closing line",
   why:"One verb, three objects, ascending from abstract to unbearably concrete.",
   usage:["Pattern: X wept/stood/fought for A, B, and the very concrete C.","Put the most specific item last."]},
  {id:'u4w11',whyzh:'证明结尾不必宏大也能永恒——温暖加上永恒(always)。',term:"a little boy and his Bear will always be playing",cat:'Quotes',
   gloss:"温柔收尾的范本 —— 魔法之地,永远有男孩和他的熊",
   hard:[["enchanted","被施了魔法的、迷人的"]],
   quote:"But wherever they go, and whatever happens to them on the way, in that enchanted place on the top of the Forest, a little boy and his Bear will always be playing.",
   src:"A.A. Milne, The House at Pooh Corner — closing line",
   why:"Proof endings needn’t be grand to be eternal — warmth plus permanence (“always”).",
   usage:["For farewells that should comfort, not impress.","Note the shape: wherever…, whatever…, in that place, X will always Y."]},
  {id:'u4w12',whyzh:'本单元的利害关系写成一顿饭：人们按最后一口评价整餐。',term:'a bad aftertaste',cat:'Phrases',
   gloss:"坏尾味 —— 精彩的内容配一个潦草的结尾,像好菜留了怪味",
   hard:[["aftertaste","回味、余味"]],
   quote:"To leave people with a rough, coarse sentence after delivering some mind-bending insight is like serving a delicious meal that has a bad aftertaste.",
   src:"BetterSpeak · Day 6",
   why:"The unit’s stakes as a dinner metaphor — people rate the meal by the last bite.",
   usage:["Great memo, bad aftertaste — rewrite the final line.","Taste-check every ending before serving."]},
  {id:'u4w13',whyzh:'有用地降低门槛：结尾要的是合拢,不是烟花。',term:'a bookend to your thought',cat:'Phrases',
   gloss:"书立式收尾 —— 不必辉煌,但要“合上”,让句子有完成感",
   hard:[["crescendo","(音乐)渐强；高潮"],["bookend","书立(夹住一排书的挡板)"]],
   quote:"Your sentence doesn’t have to be this grand crescendo… but it should feel complete. It should feel like a bookend to your thoughts.",
   src:"BetterSpeak · Day 6",
   why:"Lowers the bar usefully: endings need closure, not fireworks.",
   usage:["No flourish needed — just close the shelf.","Complete beats clever."]},
  {id:'u4w14',whyzh:'结尾为何比开头更值钱：沉默会免费重播你的最后一句。',term:'the mind returns to the last thing it heard',cat:'Phrases',
   gloss:"停顿时,听者的脑子会自动回放你的最后一句 —— 近因效应的口语版",
   hard:[],
   quote:"The second the listener’s mind doesn’t have something new to feast upon, it returns to feast upon the last thing that it heard.",
   src:"BetterSpeak · Day 6",
   why:"Why endings out-earn openings: silence replays your final words for free.",
   usage:["Place the number you want remembered LAST.","Then pause — let the replay run."]},
  {id:'u4w15',whyzh:'零成本的表达技巧：庄重是一个决定,不是一种天赋。',term:'your final words(练习)',cat:'Phrases',
   gloss:"临终之言练习：朗读每个句子前,假想这是你在世上说的最后一句话",
   hard:[],
   quote:"Before you read each sentence aloud, imagine that those words were the last words you said on Earth. Would you deliver them with majesty and passion, or skim through like reading a nutrition label?",
   src:"BetterSpeak · Day 6, the Eternal Elements exercise",
   why:"A delivery hack that costs nothing: gravity is a decision, not a talent.",
   usage:["Try it on your next toast — once.","Majesty or nutrition label: choose before speaking."]},
  {id:'u4w16',whyzh:'世上最便宜的自信升级：让最后一个音节往下走。',term:'downward inflection',cat:'Words',
   gloss:"降调收尾 —— 句尾音高下沉；研究称可让“被感知的自信”翻三倍",
   hard:[["inflection","语调的抑扬(inflect 屈折)"]],
   quote:"Lowering the pitch at the end of a sentence can triple the speaker’s perceived confidence in their claims.",
   src:"BetterSpeak · Day 6, citing a Psychology Today study",
   why:"The cheapest confidence upgrade in existence: aim the last syllable downhill.",
   usage:["Practice on your own name: land it low.","Statements sink; questions rise. Keep them distinct."]},
  {id:'u4w17',whyzh:'命名即治疗：一旦听见自己的尾音上扬,你就能把它压下来。',term:'uptalk(反面词)',cat:'Words',
   gloss:"升调症：陈述句说成疑问句？让每句话都在等别人批准？",
   hard:[["uptalk","升调说话(也叫 upspeak)"],["galloping","飞奔的"]],
   quote:"Uptalk creates a sense of incompleteness, as if the sentence were galloping toward some destination that we never arrive at.",
   src:"BetterSpeak · Day 6",
   why:"Naming it is curing it: once you hear your own rise, you can aim it down.",
   usage:["Record one voicemail; count the question-marks you didn’t intend.","Nervousness rises; confidence lands."]},
  {id:'u4w18',ctxzh:"金公开生涯的最后一句话:《我已到过山顶》(1968)的收束,引《共和国战歌》——我的眼睛已看见主降临的荣光。说完他转身坐下,次日遇刺。",whyzh:'他人生最后一场演讲,结在一句借来的圣歌上——词库、永恒元素、降调落地,三者同时在场。',term:'mine eyes have seen the glory',cat:'Quotes',
   gloss:"『我的眼已见那荣光』—— 山顶演讲的最后一句,借圣歌收束一生",
   hard:[["mine eyes","我的双眼(旧式英语：my 在元音前作 mine(莎翁与钦定本时代))"]],
   quote:"And so I’m happy tonight… Mine eyes have seen the glory of the coming of the Lord.",
   src:"Martin Luther King’s final public words, “I’ve Been to the Mountaintop” (1968) — on the Speech Bank",
   why:"He ended his last speech on a borrowed hymn line — the commonplace book, the eternal element, and the downward landing, all at once.",
   usage:["Borrow a line larger than the moment for endings that must hold.","History’s heaviest ending was a quotation."]},
  {id:'u4w19',whyzh:'由祈使句和一个名字组成的结尾——不做总结,给出方向、亲密和重复。',term:'look up, Hannah',cat:'Quotes',
   gloss:"『抬起头来,汉娜』—— 用一个动作词收尾,把听众的目光抬起来",
   hard:[],
   quote:"Look up, Hannah! The soul of man has been given wings… Look up, Hannah! Look up!",
   src:"Charlie Chaplin, the final lines of The Great Dictator (1940) — on the Speech Bank",
   why:"An ending made of imperatives and a name — direction, intimacy, and repetition instead of summary.",
   usage:["End on a direction, not a recap: look up / go build / begin.","Addressing one person moves the whole room."]},
  {id:'u4w20',whyzh:'把结尾写成一幅安歇的风景——用地理表达安全。',term:'its sheltering peaks',cat:'Quotes',
   gloss:"『四面环护的群峰』—— 以安宁的地景收束全书",
   hard:[["tranquil","宁静的"],["sheltering","庇护的"]],
   quote:"It stretched before them to the misty east, a tranquil land of rich black soil, wide slow-moving rivers… protected on all sides by its sheltering peaks.",
   src:'“Summer” — closing-lines list, BetterSpeak Day 6 (author unverified)',
   why:"Completes the course’s list of 11: an ending as a landscape at rest — safety rendered in geography.",
   usage:["Close journeys (projects, semesters) on an image of arrival.","Peace is a valid final note; not every ending is thunder."]},
 ]},
{id:'uVm',title:'Voice Models',zh:'声音样板',from:'Day 6 · Great Vocal Tracks · 声音临摹素材',
 essence:'Day 6’s second action item: pick ONE voice you admire and <b>mimic its tonality, rhythm, and pitch</b> — not to steal an identity, but to walk in the tracks of a great voice and discover your own range. Thirteen trained instruments to choose from.<br><span style="color:var(--muted)">选一个喜欢的声音模仿其音调与节奏——为了发现自己的音域,不是变成别人。</span>',
 words:[
  {id:'uVmw1',whyzh:'胸腔共鸣的参照系——句子落地时像判决。',term:'Orson Welles',cat:'Phrases',gloss:"浑厚共鸣的男中音,自带剧场纵深 — rich, resonant baritone",hard:[["baritone","男中音"],["resonant","共鸣的、洪亮的"]],quote:"Rich, resonant baritone with theatrical depth.",src:"BetterSpeak · Great Vocal Tracks",why:"The reference point for chest resonance — sentences land like verdicts.",usage:["Mimic one line of one interview clip daily.","Steal the unhurried pace, not the accent."]},
  {id:'uVmw2',whyzh:'证明“慢”是超能力——他让每一次停顿都千金难买。',term:'Alan Rickman',cat:'Phrases',gloss:"深沉如天鹅绒,带一丝讥诮 — deep, velvety, sardonic",hard:[["velvety","天鹅绒般的"],["sardonic","讥诮的、冷嘲的"]],quote:"Deep, velvety, with a hint of sardonic wit.",src:"BetterSpeak · Great Vocal Tracks",why:"Proof that SLOW is a superpower — he makes pauses feel expensive.",usage:["Practice his drawl on one sentence; feel how delay adds weight.","Sardonic ≠ mean: it’s wit served cold."]},
  {id:'uVmw3',whyzh:'舞台训练的有声版：每个辅音都收尾,每一行都有造型。',term:'Patrick Stewart',cat:'Phrases',gloss:"清亮、共鸣、莎剧式的优雅 — clear, Shakespearean elegance",hard:[],quote:"Clear, resonant, Shakespearean elegance.",src:"BetterSpeak · Great Vocal Tracks",why:"Stage training made audible: every consonant finished, every line shaped.",usage:["Mimic him to fix swallowed word-endings.","Make it so — three words, full authority."]},
  {id:'uVmw4',whyzh:'“惊奇感”的大师课：不靠音量的权威。',term:'David Attenborough',cat:'Phrases',gloss:"温暖、亲切、引人入胜的轻柔 — warm, inviting gentleness",hard:[],quote:"Warm, inviting, with a compelling gentleness.",src:"BetterSpeak · Great Vocal Tracks",why:"The masterclass in wonder: authority without volume.",usage:["Narrate something mundane in his register — your coffee, the bus.","Gentleness holds attention longer than force."]},
  {id:'uVmw5',whyzh:'教师之声：精确,却从不居高临下。',term:'LeVar Burton',cat:'Phrases',gloss:"流畅、富于表情、温暖清晰 — smooth, expressive, warm clarity",hard:[],quote:"Smooth, expressive, warm clarity.",src:"BetterSpeak · Great Vocal Tracks",why:"The teacher’s voice: precision that never talks down.",usage:["Model for explaining methods to non-specialists.","Warmth + clarity is the seminar sweet spot."]},
  {id:'uVmw6',whyzh:'质感即签名——那点沙砾让流畅变得有意思。',term:'Jeremy Irons',cat:'Phrases',gloss:"顺滑、醇厚、带砂砾感的贵族式的从容 — gravelly aristocratic coolness",hard:[["gravelly","沙哑的(gravel 碎石)"],["aristocratic","贵族式的"]],quote:"Smooth, rich, with a gravelly aristocratic coolness.",src:"BetterSpeak · Great Vocal Tracks",why:"Texture as signature — the gravel makes the smoothness interesting.",usage:["Listen for how he ends phrases DOWNWARD — Day 6’s inflection rule, embodied.","Coolness = never chasing the listener."]},
  {id:'uVmw7',whyzh:'说话像格言的学者——思想被裁出了节奏。',term:'Marshall McLuhan',cat:'Phrases',gloss:"自信、富表现力、有说服节奏 — confident, persuasive cadence",hard:[["cadence","节奏、语调的起伏"]],quote:"Confident, expressive tone conveying a persuasive cadence.",src:"BetterSpeak · Great Vocal Tracks",why:"The academic who sounded like aphorisms — ideas cut to rhythm.",usage:["Model for conference talks: punchy, quotable, paced.","The medium is the message — cadence included."]},
  {id:'uVmw8',whyzh:'随取随用的音域：同一件乐器,奏得出温暖、钢铁和讽刺。',term:'Cate Blanchett',cat:'Phrases',gloss:"清脆、字字清晰、表现力多变 — crisp, expressive versatility",hard:[["crisp","清脆利落的"]],quote:"Crisp, articulate, with an expressive versatility.",src:"BetterSpeak · Great Vocal Tracks",why:"Range on demand: the same instrument does warmth, steel, and irony.",usage:["Mimic one interview answer; notice her full stops.","Crispness reads as preparation."]},
  {id:'uVmw9',whyzh:'权威与温暖不是取舍——她两个同时开着。',term:'Judi Dench',cat:'Phrases',gloss:"温暖而有权威,音色独一无二 — warm, authoritative timbre",hard:[["timbre","音色"]],quote:"Warm, authoritative, with a distinctive timbre.",src:"BetterSpeak · Great Vocal Tracks",why:"Authority and warmth are not a tradeoff — she runs both at once.",usage:["The register for delivering hard feedback kindly.","Low volume, high command."]},
  {id:'uVmw10',whyzh:'以说话的速度耍机锋——证明 articulate 可以听起来像玩。',term:'Emma Thompson',cat:'Phrases',gloss:"明亮、口齿清晰、毫不费力的表达 — bright, effortlessly expressive",hard:[],quote:"Bright, articulate, effortlessly expressive.",src:"BetterSpeak · Great Vocal Tracks",why:"Wit at speaking speed — proof articulacy can sound like play.",usage:["Model for Q&A sessions: quick without rushing.","Effortlessness is rehearsed — that’s the secret."]},
  {id:'uVmw11',whyzh:'停顿大师：她让沉默替她说完句子(Day 14 的身体力行)。',term:'Maya Angelou',cat:'Phrases',gloss:"深沉如歌,带着回响的智慧 — deep, melodious, resonant wisdom",hard:[["melodious","如旋律般的"]],quote:"Deep, melodious, with a resonant wisdom.",src:"BetterSpeak · Great Vocal Tracks",why:"The pause master: she lets silence finish her sentences (Day 14, embodied).",usage:["Play one interview clip; count the pauses.","Slow down until it feels wrong — that’s her speed."]},
  {id:'uVmw12',whyzh:'零尾音上扬——每个句子都稳稳落地(Day 6 的降调)。',term:'Sigourney Weaver',cat:'Phrases',gloss:"清亮、强健、自信的果断 — clear, strong, confident assertiveness",hard:[["assertiveness","果断、坚定"]],quote:"Clear, strong, with a confident assertiveness.",src:"BetterSpeak · Great Vocal Tracks",why:"Zero uptalk — every sentence lands on its feet (Day 6’s downward inflection).",usage:["Model when you need the room to stop moving.","Assertive ≠ loud; it’s finished sentences."]},
  {id:'uVmw13',whyzh:'声音灵活度的天花板——语域是一种选择,不是一种习惯。',term:'Meryl Streep',cat:'Phrases',gloss:"千变万化、细腻、情感光谱极宽 — adaptable, nuanced, rich range",hard:[["nuanced","细腻的、有层次的"]],quote:"Adaptable, nuanced, with a rich emotional range.",src:"BetterSpeak · Great Vocal Tracks",why:"The ceiling of vocal flexibility — register as a choice, not a habit.",usage:["Try one sentence three ways: warm, wry, cold.","Range is trained one imitation at a time."]},
 ]},
{id:'u5',title:'Simile & Metaphor',zh:'明喻与隐喻',from:'Day 7 · Evocative Language · 画面感语言',
 essence:'The language of the mind is images: sentences with pictures get remembered. A <b>simile</b> compares with like/as; a <b>metaphor</b> says A <i>is</i> B. To build one, ask: <b>what trait does my idea have? what else has that trait?</b><br><span style="color:var(--muted)">心智的语言是图像；明喻用 like/as,隐喻问两个问题就能现场造。</span>',
 words:[
  {id:'u5w1',ctxzh:"“我有一个梦想”中段引《圣经·阿摩司书》:惟愿公平如大水滚滚,使公义如江河滔滔——用和合本的经文语域给运动背书,也是他最常引用的一节先知书经文。",whyzh:'正义是抽象的,奔涌的河不是。抽象概念配自然意象,是明喻的经典打法。',term:'like a mighty stream',cat:'Similes',
   gloss:'如浩荡江河 —— 给抽象概念一个奔涌的画面',
   hard:[['mighty','浩大的、强大的(比 strong 更有史诗感)'],['stream','水流；mighty stream = 大江大河']],
   quote:'…until justice rolls down like waters and righteousness like a mighty stream.',
   src:'Martin Luther King, “I Have a Dream” (1963), echoing the Book of Amos',
   why:'Justice is abstract; a rushing river is not. Pairing an abstract idea with a natural image is the classic simile move.',
   usage:['Once the team warmed up, ideas flowed like a mighty stream.','Pattern: X rolls down like waters — unstoppable arrival.']},
  {id:'u5w2',ctxzh:"卓别林《大独裁者》(1940)结尾:小理发师被误认成独裁者,他放弃扮演,直接向镜头、向全世界演说。这句骂的是纳粹式的“机器人”——机器的头脑,机器的心。美国参战前夜好莱坞最勇敢的四分钟。",whyzh:'一个词(machine)横穿三个名词(men / minds / hearts)——重复和隐喻一笔完成。',term:'machine men with machine minds',cat:'Quotes',
   gloss:'机器一样的人、机器的头脑 —— 谴责失去人性的顺从',
   hard:[['machine men','像机器一样、没有心的人']],
   quote:"Don't give yourselves to these unnatural men — machine men with machine minds and machine hearts! You are not machines! You are men!",
   src:'Charlie Chaplin, the closing speech of The Great Dictator (1940)',
   why:'One word (machine) repeated across three nouns (men / minds / hearts) — repetition and metaphor in a single stroke.',
   usage:['The review read like it was written by machine men with machine minds — technically correct, missing the point.','The repeat-and-swap structure itself is worth stealing.']},
  {id:'u5w3',whyzh:'方法比句子更重要：特征→还有什么有此特征→进入那个框架,相关词汇会自己涌来。',term:'my head is a battlefield',cat:'Phrases',
   gloss:'我的头像战场 —— 隐喻两步法的成品',
   hard:[['battlefield','战场；进入“战争”框架后,victory / losses / courage 会自动涌上来']],
   quote:'What characteristic does my idea have? Pain. What else has that characteristic? War… My head is a battlefield.',
   src:'BetterSpeak · demonstrating the two-question metaphor method',
   why:'The method matters more than the line: trait → what else has it → enter that frame, and related words start arriving on their own.',
   usage:['Deadline week: my calendar is a battlefield.','Drill: pick any object, ask the two questions, build one metaphor.']},
  {id:'u5w4',whyzh:'框架示范：雪崩和军队共享“力量”,一相撞,隐喻就出现了。',term:'an army of snow',cat:'Phrases',
   gloss:'一支雪的军队 —— 雪崩的隐喻',
   hard:[['avalanche','雪崩']],
   quote:'An avalanche is an army of snow.',
   src:'BetterSpeak · Metaphor Worksheet — playing in the key of "power"',
   why:'A demo of frames: avalanche and army share "power"; collide them and the metaphor appears.',
   usage:['By Friday my inbox was an army of unread mail.','Drill: pick a key (power, tide, moon) and collide its words.']},
  {id:'u5w5',whyzh:'把一个框架(收成)的名词借给另一个框架(星空)——丰饶感直接迁移。',term:'a rich harvest of stars',cat:'Phrases',
   gloss:'繁星如丰收 —— 满天星斗像谷仓里的收成',
   hard:[['harvest','收成、丰收']],
   quote:'The New Mexico sky is a rich harvest of stars.',
   src:'BetterSpeak · Metaphor Worksheet — playing in the key of "moon"',
   why:'Nouns from one frame (harvest) borrowed for another (sky) — abundance transfers.',
   usage:['Pittsburgh in October is a rich harvest of color.','Pattern: a rich harvest of + plural noun.']},
  {id:'u5w6',whyzh:'证明“错误的”形容词才出最鲜的画面——拿五个怪形容词去撞你看到的每个名词。',term:'the rainbow has been decaffeinated',cat:'Phrases',
   gloss:'彩虹被“去了咖啡因” —— 形容词乱撞撞出的新鲜比喻',
   hard:[['decaffeinated','去咖啡因的→(比喻)被抽走了劲儿的、变淡的']],
   quote:'My day has been bleached of sound and color. Even the rainbow this afternoon has been decaffeinated.',
   src:'BetterSpeak · Metaphor Worksheet’s adjective-collision exercise',
   why:'Proof that "wrong" adjectives make the freshest images — push five odd adjectives against every noun you see.',
   usage:['Without you the party felt decaffeinated.','Drill: put 5 odd adjectives on your lock screen today.']},
  {id:'u5w7',whyzh:'生成器本身：开口前先定个调,隐喻到达时已经在调上。',term:"playing in the key of tide",cat:'Phrases',
   gloss:"在“潮汐”这个调上弹 —— 同框词：ocean, moon, recede, power",
   hard:[["key","(音乐)调；这里指语义的“框架”"]],
   quote:"This is ‘playing in the key of tide,’ where tide is the fundamental tone.",
   src:"BetterSpeak · Metaphor Worksheet, after Pat Pattison",
   why:"The generator itself: pick a key before you speak, and metaphors arrive already in tune.",
   usage:["Before a talk, pick a key: war, garden, tide, harvest.","List five words in that key; collide them."]},
  {id:'u5w8',whyzh:'名词动用=瞬间隐喻——一个词干完整幅画。',term:"Muhammad Ali avalanched over his opponents",cat:'Phrases',
   gloss:"阿里像雪崩一样碾过对手 —— 名词当动词用",
   hard:[["avalanche (v.)","雪崩；此处动词化：如雪崩般压倒"]],
   quote:"Muhammad Ali avalanched over his opponents.",
   src:"BetterSpeak · Metaphor Worksheet — the key of “power”",
   why:"Verbing a noun is instant metaphor — one word does the whole image.",
   usage:["The rebuttal avalanched over their objections.","Drill: verb one noun today (to snowball, to bulldoze, to orbit)."]},
  {id:'u5w9',whyzh:'抽象(勇气)+具体容器(日历):容器模具能让任何抽象可见。',term:"a calendar of human courage",cat:'Phrases',
   gloss:"人类勇气的日历 —— 抽象名词装进具体容器",
   hard:[],
   quote:"Astronauts’ flights are a calendar of human courage.",
   src:"BetterSpeak · Metaphor Worksheet — the key of “moon”",
   why:"Abstract (courage) + concrete container (calendar): the container mold makes any abstraction visible.",
   usage:["Her CV is a calendar of quiet persistence.","Pattern: a calendar / harvest / army of + abstract noun."]},
  {id:'u5w10',whyzh:'故意的尺度错位：小小插座对上海潮——惊讶就是火花。',term:"tides of electricity",cat:'Phrases',
   gloss:"电的潮汐 —— 插座拦着一整片海",
   hard:[["socket","插座"]],
   quote:"A socket holds back tides of electricity.",
   src:"BetterSpeak · Metaphor Worksheet",
   why:"Scale mismatch on purpose: a tiny socket vs oceanic tides — surprise is the spark.",
   usage:["One inbox rule holds back tides of email.","Pattern: small X holds back tides of Y."]},
  {id:'u5w11',whyzh:'月亮框架给知识一个形状和一个承诺：还在盈满中。',term:"the crescent of human knowledge",cat:'Phrases',
   gloss:"人类知识的月牙 —— 未满,而在生长",
   hard:[["crescent","月牙、新月"]],
   quote:"The crescent of human knowledge grows with each astronaut’s mission.",
   src:"BetterSpeak · Metaphor Worksheet",
   why:"The moon-frame gives knowledge a shape and a promise: still filling in.",
   usage:["Each replication grows the crescent of what we know.","Humble + hopeful in one image."]},
  {id:'u5w12',whyzh:'harvest 一个词偷运了三层意思：季节、丰饶、成熟。',term:"a harvest of lovers",cat:'Phrases',
   gloss:"黄昏把一茬情侣送到海滩 —— 丰收框架的另一种用法",
   hard:[],
   quote:"Evening brings a harvest of lovers to the beach.",
   src:"BetterSpeak · Metaphor Worksheet",
   why:"Harvest implies season, abundance, ripeness — three meanings smuggled in one word.",
   usage:["September brings a harvest of new students to campus.","Pattern: [time] brings a harvest of X to Y."]},
  {id:'u5w13',whyzh:'会吵架的隐喻：比较本身就是批评。',term:"social media is a lavatory wall",cat:'Quotes',
   gloss:"社交媒体是厕所墙 —— 人们往上面乱涂乱写",
   hard:[["lavatory","厕所(英式,比 toilet 文一点)"]],

  {id:'u5w14',whyzh:'精确让疼痛可信：不是 uncomfortable,而是铁、棍、胫骨。',term:"like an iron bar pressed into my shin",cat:'Similes',

  {id:'u5w17',whyzh:'两词复合词是随身携带的隐喻——像工具一样收集。',term:"verbal gymnastics · theater of the imagination",cat:'Phrases',
   gloss:"两词隐喻组：mental landscape(心智地形)· intellectual joust(智力比武)· ideological cocktail(观念鸡尾酒)· mosaic of information(信息马赛克)",

  {id:'u5w18',whyzh:'新鲜隐喻的生成器：故意“用错”的形容词,硬安到平常名词上。一天撞三次就算训练,擦出一个火花就全值回来。',term:'the collision list',cat:'Phrases',
   gloss:'a pocket list of odd adjectives to smash into every noun until a metaphor sparks — 随身备一小列怪形容词,逢名词就相撞,撞出新鲜比喻为止',
   hard:[],

  {id:'u5w19',ctxzh:"“我有一个梦想”梦的段落之后、“带着这个信念”(with this faith)一段:我们能从绝望之山凿出希望之石——全篇最浓缩的意象;华盛顿的金纪念雕像就叫“希望之石”,这句话刻在雕像侧面。",whyzh:'绝望获得质量(山),希望获得可握的尺寸(石),一个动词(hew 凿)把信念变成采石的活计。',term:'a stone of hope from a mountain of despair',cat:'Quotes',

  {id:'u5w20',whyzh:'单词隐喻：蘑菇的整部传记(一夜之间、遍地都是、凭空冒出)都骑在这个动词里。',term:'mushroomed',cat:'Words',

{id:'u6',title:'Workhorse Upgrades',zh:'万能词升级',from:'Day 8 · Workhorse Words · 万能词',
 essence:'good / great / awesome are <b>workhorse words</b> — common and vague, they flatten rich experience into one cheap adjective. Upgrade one at a time: pick your most-abused word, notice its context, choose a precise replacement. Your personal catchphrases are your <b>verbal brand</b> — keep those.<br><span style="color:var(--muted)">good/great 这类万能词把体验压扁；一次升级一个,自己的口头禅保留。</span>',
 words:[
  {id:'u6w1',whyzh:'不是背同义词——一个语境配一个精确词。nourishing 的信息量远大于 good。',term:'good → nourishing · vivid · restorative',cat:'Workhorse swaps',
   gloss:'按语境替换 good:食物→nourishing(滋养) / 艺术→vivid(鲜活) / 休息→restorative(回血)',
   hard:[['nourishing','滋养的'],['vivid','鲜活的、栩栩如生的'],['restorative','恢复元气的']],
   quote:'We collapse the rich, dynamic texture of our experience into a vague, cheap adjective.',
   src:'BetterSpeak · on the cost of workhorse words',
   why:'Not synonym-memorizing — one context, one precise word. "Nourishing" carries far more information than "good."',
   usage:["The dinner wasn't just good — it was nourishing.",'That weekend in the mountains was restorative.']},
  {id:'u6w2',whyzh:'“像逗号一样用”=自动驾驶,不是选择。停半秒,精确的词自己会浮上来。',term:'great → remarkable · heartening',cat:'Workhorse swaps',
   gloss:'收到好消息别只会 great:remarkable(了不起)/ heartening(令人振奋、心里一暖)',
   hard:[['remarkable','值得评说的→了不起的'],['heartening','让人受鼓舞的(hearten 鼓舞)']],
   quote:'I noticed that I use "great" like a comma.',
   src:"BetterSpeak · Day 8 — the course author's own first upgrade",
   why:'"Like a comma" — that’s autopilot, not choice. A half-second pause lets the precise word surface.',
   usage:["That's heartening news about the grant.",'Her progress this semester has been remarkable.']},
  {id:'u6w3',whyzh:'研讨会上 interesting 等于什么都没说。说清是哪种有趣：引人好奇？醍醐灌顶？出人意料？',term:'interesting → intriguing · illuminating',cat:'Workhorse swaps',
   gloss:'interesting 是万金油；intriguing(勾人好奇)/ illuminating(令人豁然开朗)更准',
   hard:[['intriguing','引人好奇的'],['illuminating','有启发性的(illuminate 照亮)']],
   quote:'(#10 on the Workhorse Words Index: "interesting.")',
   src:'BetterSpeak · Workhorse Words Index (50 words)',
   why:'In seminars "interesting" says nothing. Say what kind of interesting: curious? clarifying? surprising?',
   usage:['That identification strategy is intriguing.','Her discussion of the null result was illuminating.']},
  {id:'u6w4',whyzh:'每个 thing 背后都藏着一个更准的名词：机制、障碍、条款、取舍。叫出名字,升级就完成了。',term:'thing → the actual noun',cat:'Workhorse swaps',
   gloss:'thing 是词汇缺口的遮羞布 —— 换成它真正指的名词',
   hard:[],
   quote:'(#31 on the index: "thing.")',
   src:'BetterSpeak · Workhorse Words Index',
   why:'Every "thing" hides a more precise noun: mechanism, obstacle, clause, tradeoff. Naming it is the upgrade.',
   usage:['Not "the thing about the model" — "the assumption behind the model."','Catch yourself: what IS the thing?']},
  {id:'u6w5',whyzh:'awesome 本义是“令人敬畏”。把强词留给强事,它们才重新有意义。',term:'awesome → breathtaking · striking',cat:'Workhorse swaps',
   gloss:'awesome 已被用平；breathtaking(令人屏息)/ striking(醒目、击中人)还保有力量',
   hard:[['breathtaking','美/壮观到让人屏住呼吸'],['striking','醒目的、令人过目不忘的']],
   quote:'(#44 on the index: "awesome.")',
   src:'BetterSpeak · Workhorse Words Index',
   why:'Awesome once meant awe. Reserve strong words for strong things and they start meaning something again.',
   usage:['The view from Mount Washington is breathtaking.','A striking result deserves a striking word.']},
  {id:'u6w6',whyzh:'按“什么让你惊叹”来选：是光彩(dazzling),还是难以置信(astonishing)。',term:"amazing → dazzling · astonishing",cat:'Workhorse swaps',
   gloss:"amazing 已被说到麻木：dazzling(耀眼)/ astonishing(令人震惊)按强度选",
   hard:[["dazzling","炫目的(dazzle 晃眼)"],["astonishing","令人震惊的"]],
   quote:"(#9 on the Workhorse Words Index: ‘amazing.’)",
   src:"BetterSpeak · Workhorse Words Index",
   why:"Pick by what amazed you: the shine (dazzling) or the disbelief (astonishing).",
   usage:["The keynote demo was dazzling.","An astonishing effect size — check it twice."]},
  {id:'u6w7',whyzh:'bad 把诊断藏起来了。说清坏在哪,句子才开始干活。',term:"bad → sloppy · harmful · dull",cat:'Workhorse swaps',
   gloss:"bad 藏住了“坏在哪”：做工差 sloppy / 有害 harmful / 无聊 dull",
   hard:[["sloppy","马虎的、潦草的"]],
   quote:"(#19 on the index: ‘bad.’)",
   src:"BetterSpeak · Workhorse Words Index",
   why:"“Bad” hides the diagnosis. Say WHY it’s bad and the sentence starts working.",
   usage:["The code isn’t bad — it’s sloppy.","A dull talk, not a bad one; the content was fine."]},
  {id:'u6w8',whyzh:'nice 什么也没评价。gracious 和 thoughtful 各自点名一种美德。',term:"nice → gracious · thoughtful",cat:'Workhorse swaps',
   gloss:"夸人别只会 nice:gracious(有风度)/ thoughtful(体贴周到)",
   hard:[["gracious","优雅大度的"]],
   quote:"(#2 on the index: ‘nice.’)",
   src:"BetterSpeak · Workhorse Words Index",
   why:"“Nice” evaluates nothing. Gracious and thoughtful each name a virtue.",
   usage:["She was gracious about the mix-up.","A thoughtful reviewer — caught what mattered."]},
  {id:'u6w9',whyzh:'把这个词按你的本意劈开——是沉着,还是出色——然后选那一半。',term:"cool → composed · impressive",cat:'Workhorse swaps',
   gloss:"cool 两个方向：情绪镇定 composed / 东西厉害 impressive",
   hard:[["composed","镇定自若的(compose oneself)"]],
   quote:"(#16 on the index: ‘cool.’)",
   src:"BetterSpeak · Workhorse Words Index",
   why:"Split the word by what you mean — poise or quality — and pick that side.",
   usage:["She stayed composed through the Q&A.","An impressive identification strategy."]},
  {id:'u6w10',whyzh:'big 把体积和重要性混为一谈。英语里本有分开的词,用上。',term:"big · huge → vast · consequential",cat:'Workhorse swaps',
   gloss:"说尺寸用 vast(浩瀚);说分量用 consequential(影响重大)",
   hard:[["consequential","后果重大的"]],
   quote:"(#30 and #43 on the index: ‘big,’ ‘huge.’)",
   src:"BetterSpeak · Workhorse Words Index",
   why:"“Big” confuses size with importance. English has separate words; use them.",
   usage:["A vast dataset, a consequential finding.","Huge news → consequential news."]},
  {id:'u6w11',whyzh:'什么都 important。central 和 urgent 说清是哪一种重要。',term:"important → central · urgent",cat:'Workhorse swaps',
   gloss:"说清“为什么重要”：核心 central / 紧迫 urgent",
   hard:[],
   quote:"(#18 on the index: ‘important.’)",
   src:"BetterSpeak · Workhorse Words Index",
   why:"Everything is “important.” Central and urgent explain the kind of importance.",
   usage:["This assumption is central to the model.","The data request is urgent, not just important."]},
  {id:'u6w12',whyzh:'witty 归功于头脑,absurd 归功于场面。funny 谁也不归功。',term:"funny → witty · absurd",cat:'Workhorse swaps',
   gloss:"好笑分两种：机智 witty / 荒诞 absurd",
   hard:[["witty","机智风趣的"],["absurd","荒诞的"]],
   quote:"(#27 on the index: ‘funny.’)",
   src:"BetterSpeak · Workhorse Words Index",
   why:"Witty credits the mind; absurd credits the situation. “Funny” credits nothing.",
   usage:["A witty discussant — every point landed twice.","The reimbursement process is absurd."]},
  {id:'u6w13',whyzh:'grating 是感官上的刺,tiresome 是累积的磨——各自说清它怎么消耗你。',term:"annoying → grating · tiresome",cat:'Workhorse swaps',
   gloss:"烦有质感：刺耳磨人 grating / 令人厌倦 tiresome",
   hard:[["grating","刺耳的、磨人的(grate 摩擦)"],["tiresome","令人厌烦的"]],
   quote:"(#39 on the index: ‘annoying.’)",
   src:"BetterSpeak · Workhorse Words Index",
   why:"Grating is sensory, tiresome is cumulative — each says how it wears on you.",
   usage:["The notification sound is grating.","The back-and-forth got tiresome by round three."]},
  {id:'u6w14',whyzh:'它们承诺一个从不兑现的简化。删掉,毫无损失。',term:"basically · essentially → (delete, or say what you simplified)",cat:'Workhorse swaps',
   gloss:"口头禅型：多半可直接删；留着就说清你简化了什么",
   hard:[],
   quote:"(#6 and #22 on the index: ‘basically,’ ‘essentially.’)",
   src:"BetterSpeak · Workhorse Words Index",
   why:"They promise a simplification that never comes. Cut them and nothing is lost.",
   usage:["“Basically, the model works” → “The model works.”","If simplifying: “Stripped of controls, the story is…”"]},
  {id:'u6w15',whyzh:'条件反射式的附和听着像自动驾驶；精确的“是”听着像在倾听。',term:"absolutely → yes · precisely",cat:'Workhorse swaps',
   gloss:"万能附和词 —— 换成真正的确认：yes / precisely / agreed",
   hard:[["precisely","正是、恰恰如此"]],
   quote:"(#12 on the index: ‘absolutely.’)",
   src:"BetterSpeak · Workhorse Words Index",
   why:"Reflex agreement sounds like autopilot. A precise yes sounds like listening.",
   usage:["“Precisely — and that’s why the control group matters.”","Save “absolutely” for actual absolutes."]},
  {id:'u6w16',whyzh:'没有诊断的抱怨。falls short 暗含一个标准；disappoints 暗含一个期望。',term:"sucks → falls short · disappoints",cat:'Workhorse swaps',
   gloss:"sucks 情绪足、信息零 —— 说清差在哪：falls short(不达标)/ disappoints(令人失望)",
   hard:[],quote:"(#20 on the index: ‘sucks.’)",src:"BetterSpeak · Workhorse Words Index",
   why:"Complaint without diagnosis. Falls short implies a standard; disappoints implies a hope.",
   usage:["The battery life falls short.","The ending disappoints — the setup deserved better."]},
  {id:'u6w17',whyzh:'stupid 攻击人；shortsighted 和 pointless 批评的是决定。',term:"stupid → shortsighted · pointless",cat:'Workhorse swaps',
   gloss:"骂之前先诊断：短视 shortsighted / 无意义 pointless",
   hard:[["shortsighted","短视的、缺乏远见的"]],quote:"(#47 on the index: ‘stupid.’)",src:"BetterSpeak · Workhorse Words Index",
   why:"Stupid attacks the person; shortsighted and pointless critique the decision.",
   usage:["A shortsighted cut to the training budget.","A pointless meeting that could have been an email."]},
  {id:'u6w18',whyzh:'staggering 带着规模,improbable 带着概率。wild 什么也不带。',term:"wild · insane → improbable · staggering",cat:'Workhorse swaps',
   gloss:"惊叹的精确版：improbable(不可思议)/ staggering(量级惊人)",
   hard:[["staggering","令人踉跄的→(数字、规模)惊人的"]],quote:"(#24 on the index: ‘wild.’)",src:"BetterSpeak · Workhorse Words Index",
   why:"Staggering carries scale; improbable carries odds. Wild carries nothing.",
   usage:["A staggering 40% of listings were duplicates.","An improbable comeback."]},
  {id:'u6w19',whyzh:'当每个动词都变成 leverage,所有动词都失去了意义。',term:"leverage → use · build on",cat:'Workhorse swaps',
   gloss:"商业黑话回收：多数时候就是 use;要说“借力”就 build on",
   hard:[],quote:"(#29 on the index: ‘leverage.’)",src:"BetterSpeak · Workhorse Words Index",
   why:"When every verb becomes leverage, no verb means anything.",
   usage:["We’ll build on last year’s cohort design.","Just say use — it’s stronger."]},
  {id:'u6w20',whyzh:'literally 留给字面上真发生的事；真诚用 genuinely。',term:"literally → (delete, or genuinely)",cat:'Workhorse swaps',
   gloss:"literally 已被用成语气词 —— 真要强调就用 genuinely",
   hard:[],quote:"(#4 on the index: ‘literally.’)",src:"BetterSpeak · Workhorse Words Index",
   why:"Reserve literally for things that literally happened; genuinely covers sincerity.",
   usage:["I was genuinely moved.","“The server literally caught fire” — only if it did."]},
  {id:'u6w21',whyzh:'俚语老得快,朴素的精确词不会。说清让你皱眉的到底是什么。',term:'cringe · lame → mortifying · feeble',cat:'Workhorse swaps',
   gloss:'网络语的替身：cringe→mortifying(尴尬到无地自容)/ lame→feeble(无力、站不住)',
   hard:[["feeble","无力的、软弱的"]],quote:"(#3 and #7 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Slang ages fast; plain precise words don’t. Say what made you wince.",
   usage:["Watching that demo fail live was mortifying.","A feeble excuse convinces no one — give the real reason."]},
  {id:'u6w22',whyzh:'热情经得起翻译成精确——而且在任何场合都落得了地。',term:"sick · killer → brilliant · devastating",cat:'Workhorse swaps',
   gloss:"夸厉害的俚语升级：brilliant(才华横溢)/ devastating(碾压级、好到一击致命)",
   hard:[["devastating","毁灭性的→(引申)碾压级的"]],quote:"(#5 and #50 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Enthusiasm survives translation into precision — and lands in any room.",
   usage:["A devastating rebuttal — two sentences, done.","A brilliant identification trick."]},
  {id:'u6w23',whyzh:'模糊的数量是浪费掉的信息——哪怕近似的精确也胜过 tons。',term:"tons · a bunch → scores of · a wealth of",cat:'Workhorse swaps',
   gloss:"数量词升级：scores of(数十计)/ a wealth of(丰富的一整批)",
   hard:[["scores of","几十、大量(score=20)"]],quote:"(#15 and #21 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Vague quantity is wasted information — even approximate precision beats “tons.”",
   usage:["A wealth of archival data.","Scores of listings, none verified."]},
  {id:'u6w24',whyzh:'toxic 不做任何诊断。corrosive 说它腐蚀信任；demoralizing 说它耗尽斗志。',term:"toxic → corrosive · demoralizing",cat:'Workhorse swaps',
   gloss:"toxic 万物皆可贴 —— 说清毒在哪：corrosive(腐蚀关系)/ demoralizing(消磨士气)",
   hard:[["corrosive","腐蚀性的"],["demoralizing","令人士气低落的"]],quote:"(#14 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"“Toxic” diagnoses nothing. Corrosive says it eats trust; demoralizing says it drains will.",
   usage:["A corrosive review culture.","Weekly reorgs are demoralizing."]},
  {id:'u6w25',whyzh:'同样的怀疑,换成法庭上站得住的措辞。',term:"sus → questionable · dubious",cat:'Workhorse swaps',
   gloss:"sus 的成人版：questionable(存疑)/ dubious(可疑、不可靠)",
   hard:[["dubious","可疑的、靠不住的"]],quote:"(#13 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Same suspicion, court-admissible wording.",
   usage:["A dubious exclusion restriction.","The timing is questionable at best."]},
  {id:'u6w26',whyzh:'会议室黑话读起来像借来的思想；平实的话读起来才像你自己的。',term:"no-brainer · win-win → an easy call · good for both sides",cat:'Workhorse swaps',
   gloss:"会议室两件套 —— 说人话：an easy call / good for both sides",
   hard:[],quote:"(#28 and #38 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Board-room shorthand reads as borrowed thought; plain speech reads as yours.",
   usage:["Given the price, it’s an easy call.","The data-sharing deal is good for both sides."]},
  {id:'u6w27',whyzh:'vibes 只是比划；atmosphere 和 undercurrent 是描述——一个看得见,一个藏在底下。',term:"vibes → atmosphere · undercurrent",cat:'Workhorse swaps',
   gloss:"vibes 的可言说版：atmosphere(氛围)/ undercurrent(暗流、潜在情绪)",
   hard:[["undercurrent","暗流；潜藏的情绪"]],quote:"(#34 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"“Vibes” gestures; atmosphere and undercurrent describe — one visible, one hidden.",
   usage:["The seminar had a generous atmosphere.","An undercurrent of worry ran through the Q&A."]},
  {id:'u6w28',whyzh:'愤怒有刻度；说出刻度,别人才知道该怎么回应。',term:"pissed → furious · exasperated",cat:'Workhorse swaps',
   gloss:"生气分档：furious(盛怒)/ exasperated(被磨到没脾气)",
   hard:[["exasperated","恼火到无奈的"]],quote:"(#46 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Anger has grades; naming the grade tells people how to respond.",
   usage:["Exasperated after the third data request.","Furious is for breaches, not typos."]},
  {id:'u6w29',whyzh:'这里的精确是双重的善意——对你的情绪,也对这个词的临床分量。',term:"depressed(滥用)→ discouraged · drained",cat:'Workhorse swaps',
   gloss:"日常低落别借临床词：discouraged(受挫)/ drained(被抽干)—— 把 depressed 留给真正的抑郁",
   hard:[["drained","精疲力竭的(drain 排空)"]],quote:"(#23 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Precision here is kindness twice over — to your mood and to the word’s clinical weight.",
   usage:["Discouraged by the desk reject, not depressed.","Drained after back-to-back teaching days."]},
  {id:'u6w30',whyzh:'微小的纠正,超额的信誉回报——这两个错别人真的会注意到。',term:"irregardless · addicting → regardless · addictive",cat:'Workhorse swaps',
   gloss:"两个“长得像词的词”：标准说法是 regardless / addictive",
   hard:[["irregardless","非标准词(双重否定构词);用 regardless"]],quote:"(#42 and #49 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Tiny corrections with outsized credibility returns — these two get noticed.",
   usage:["Regardless of specification, the sign holds.","Short-form video is engineered to be addictive."]},
  {id:'u6w31',whyzh:'最高级夸大,含糊词泄气——两者都在遮掩你真实的判断。',term:"best · pretty (good) → strongest · fairly",cat:'Workhorse swaps',
   gloss:"best 滥用成口头禅→strongest(最有力的);pretty good 的 pretty 是对冲→fairly 或直接删",
   hard:[],quote:"(#8 and #26 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Superlatives inflate and hedges deflate — both hide your real estimate.",
   usage:["Our strongest specification, not our best one.","Fairly robust — or just: robust."]},
  {id:'u6w32',whyzh:'这两个词字面上宣称“无法相信”“属于幻想”——早已不再表达自己本义的词。',term:"unbelievable · fantastic → astounding · marvelous",cat:'Workhorse swaps',
   gloss:"惊叹二件套的替身：astounding(令人震惊)/ marvelous(妙极,带一点复古的郑重)",
   hard:[["astounding","令人震惊的(astound 使惊骇)"]],quote:"(#35 and #36 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Both originals literally claim disbelief and fantasy — words that stopped meaning themselves.",
   usage:["An astounding response rate.","A marvelous seminar question."]},
  {id:'u6w33',whyzh:'名气是人头数；celebrated 和 defining 是判断——直接说出判断。',term:"famous · iconic → celebrated · defining",cat:'Workhorse swaps',
   gloss:"famous 只说知名度；celebrated(备受推崇)/ defining(定义了一个时代/领域)说出为什么",
   hard:[["celebrated","受赞誉的"],["defining","起定义作用的"]],quote:"(#45 and #25 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Fame is a headcount; celebration and definition are judgments — say the judgment.",
   usage:["A celebrated result in market design.","The defining paper of that literature."]},
  {id:'u6w34',whyzh:'不屑和受伤都配得上真正的词——俚语版只会终结对话。',term:"whatever · triggered → it doesn’t change the answer · stung",cat:'Workhorse swaps',
   gloss:"whatever 等于当面关门；说清“这不影响结论”。triggered 被网络用烂；真实感受用 stung(刺痛)/ provoked",
   hard:[["stung","被刺痛(sting 的过去分词)"]],quote:"(#41 and #40 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"Dismissal and hurt both deserve real words — the slang versions end conversations.",
   usage:["Noted — and it doesn’t change the answer.","The review stung; the revision helped."]},
  {id:'u6w35',whyzh:'随口的强化词会老化成噪音；朴素的成人版不会。',term:"full-blown · legit(imately) → outright · genuinely",cat:'Workhorse swaps',
   gloss:"full-blown→outright(彻头彻尾);legit→genuinely(真心地)或 legitimate(正当的)本词",

   why:"Casual intensifiers age into noise; the plain adult forms don’t.",
   usage:["An outright contradiction between Tables 2 and 4.","Genuinely impressed by the robustness section."]},
  {id:'u6w36',whyzh:'三连形式只增加音节,不增加意思——这份清单上最纯粹的填充物。',term:"in any way, shape, or form → in any way",cat:'Workhorse swaps',
   gloss:"六个词说一件事 —— in any way 就够",
   hard:[],quote:"(#17 on the index.)",src:"BetterSpeak · Workhorse Words Index",
   why:"The tripled form adds syllables, not meaning — the purest padding on the list.",

 ]},
{id:'u9',title:'Pruning Dead & Empty Language',zh:'删繁就简',from:'Days 9–10 · Dead Phrases & Empty Language · 套话与废词',
 essence:'Dead phrases are borrowed thought on autopilot; empty language — <b>intensifiers, qualifiers, fillers, operators</b> — is padding. Reduce, don’t eliminate: some familiarity keeps speech human. Rule #9: <b>a sentence grows fuller when empty words are stripped away.</b><br><span style="color:var(--muted)">套话是借来的思想,废词是填充；做减法句子反而更满——减少,不消灭。</span>',
 words:[
  {id:'u9w1',whyzh:'套话=声音出来了,脑子没参与。把每个套话用自己的话重讲一遍。',term:'at the end of the day → ultimately',cat:'Workhorse swaps',
   gloss:'烂大街的“说到底” —— 换成自己的话',
   hard:[],
   quote:'A speaker who uses that kind of phraseology has gone some distance toward turning himself into a machine.',
   src:'George Orwell, “Politics and the English Language” (1946) — on the Dead Phrases Index',
   why:'Stock phrases mean the noises come out but the mind isn’t involved. Reinterpret each one in your own words.',
   usage:['Ultimately, the estimate survives every check.','Or make it yours: "when everything settles…"']},
  {id:'u9w2',whyzh:'练法：在你常用的每句陈词滥调上停一下,用平实的话重说。那种费劲,正是训练本身。',term:'low-hanging fruit → the easiest wins',cat:'Workhorse swaps',
   gloss:'『低垂的果实』= 最容易到手的成果——本身也熟透成了套话；直接说“最容易的几个赢面”',
   hard:[],
   quote:'Cliché is the opposite of invention — a missed opportunity to exercise creativity.',
   src:'“Warren Hardgraves,” per BetterSpeak Day 9 (person unverified)',
   why:'The drill: pause on each cliché you overuse and re-say it plainly. The strain is the exercise.',
   usage:['Let’s take the easiest wins first: fix the tables, then the framing.','Your own words > borrowed metaphors.']},
  {id:'u9w3',whyzh:'Fry 称之为廉价的词噪音。我们以为词越多越强调；恰恰相反。',term:'super / really / literally → (delete)',cat:'Workhorse swaps',
   gloss:'强化词是“廉价的词噪音” —— 删掉后句子反而更有力',
   hard:[['intensifier','(术语)强化词：kind of / really / super / literally / honestly…']],
   quote:'(Intensifiers — super, really, literally: all on the Empty Language Index.)',
   src:'BetterSpeak · Empty Language Index — intensifiers',
   why:'Stephen Fry (per the course) called them cheap word noise. We pad words believing more words = more emphasis; the opposite is true.',
   usage:['Cut one intensifier from every sentence today.','Sentences without them sound astonishingly clear.']},
  {id:'u9w4',whyzh:'在心里给句子敲上一个坚定的句号。那一秒的空隙,尾巴自己就化掉了。',term:"…that's just my opinion → (silent period)",cat:'Workhorse swaps',
   gloss:'侵蚀尾巴：自己拆自己台的结尾 —— 用“心里默念句号”替代',
   hard:[['erosion tag','(术语)侵蚀尾：and yeah / that’s just my opinion / so… yeah']],
   quote:'(Erosion tags — the trailing qualifiers that eat a sentence: on the Empty Language Index.)',
   src:'Rule #10 of Articulacy — fixed by the "silent period" technique',
   why:'End the sentence in your mind with a firm "period." That one-second gap dissolves the tag.',
   usage:['Deliver the claim. Period. Silence.','Anchor it physically: blink, or press a finger to your leg.']},
  {id:'u9w5',whyzh:'两个想法接不上时,我们才去抓 operator。去找那个能把它们接起来的动词。',term:'in terms of → (bridge with one word)',cat:'Workhorse swaps',
   gloss:'“就……而言”是接不上话时随手抓的那包阿司匹林(Orwell 的比喻)——找到那个动词直接说',
   hard:[['operator','(术语)连接短语：when it comes to / with respect to / in terms of']],
   quote:"Ready-made phrases “are a continuous temptation, a packet of aspirins always at one's elbow” (Orwell).",
   src:'George Orwell, “Politics and the English Language” (1946) — via BetterSpeak Day 10',
   why:'We reach for operators when two ideas won’t connect. Find the verb that connects them instead.',
   usage:['Not "in terms of finding a solution" — "to solve it."','Practice: rebuild one operator-sentence per day.']},
  {id:'u9w6',whyzh:'这个套话让你指着问题却不点名。点名才是需要勇气的那一步。',term:"elephant in the room → name it plainly",cat:'Workhorse swaps',
   gloss:"“房间里的大象”本身也成了套话 —— 直接说出大家在回避什么",
   hard:[],
   quote:"(On the Dead Phrases Index.)",
   src:"BetterSpeak · Dead Phrases Index",
   why:"The cliché lets you gesture at the problem without naming it. Naming it is the brave part.",
   usage:["Let’s name what we’ve been avoiding: the study is underpowered.","Say the thing, not the animal."]},
  {id:'u9w7',whyzh:'一条没有内容的指令。升级版就是那个具体的替代方案本身。',term:"think outside the box → say the actual move",cat:'Workhorse swaps',
   gloss:'“跳出盒子想”的空口号——升级版是说出那个具体的新做法',
   hard:[],
   quote:"(On the Dead Phrases Index.)",
   src:"BetterSpeak · Dead Phrases Index",
   why:"An instruction with no content. The upgrade is the concrete alternative itself.",
   usage:["Not “think outside the box” — “what if we flip the control group?”","Replace slogans with moves."]},
  {id:'u9w8',whyzh:'含糊的动词造出含糊的会议；具体的词造出具体的日程。',term:"touch base → a 15-minute check-in Thursday",cat:'Workhorse swaps',
   gloss:'“碰个头/联系一下”的办公室黑话——换成“周四 15 分钟碰一次”',
   hard:[],
   quote:"(On the Dead Phrases Index.)",
   src:"BetterSpeak · Dead Phrases Index",
   why:"Vague verbs create vague meetings. Concrete words create concrete calendars.",
   usage:["“Let’s touch base” → “15 minutes Thursday to settle the sample.”","Specificity is a kindness."]},
  {id:'u9w9',whyzh:'人人都 deep-dive,没人说自己到底要干什么。价值在动词里。',term:"deep dive → a close read · a real audit",cat:'Workhorse swaps',
   gloss:"“深潜”已经潜不下去了 —— 说出你实际要做的动作",
   hard:[],
   quote:"(On the Dead Phrases Index.)",
   src:"BetterSpeak · Dead Phrases Index",
   why:"Everyone deep-dives; nobody says what they’ll actually do. The verb is the value.",
   usage:["“I’ll do a close read of the appendix.”","“We audited every cell” beats “we did a deep dive.”"]},
  {id:'u9w10',whyzh:'既然有指针,就有数字。把数字说出来,就是 articulate 的版本。',term:"move the needle → name the metric",cat:'Workhorse swaps',
   gloss:'“拨动指针”= 产生看得见的影响——指针在哪？什么单位？直接说数字和指标',
   hard:[],
   quote:"(On the Dead Phrases Index.)",
   src:"BetterSpeak · Dead Phrases Index",
   why:"If there’s a needle, there’s a number. Saying the number is the articulate version.",
   usage:["“Raise response rates by five points” beats “move the needle.”","Metrics are the anti-cliché."]},
  {id:'u9w11',whyzh:'课上被当场点名的条件反射短语。要对冲就用内容对冲,别撒调味料。',term:"take it with a grain of salt → treat it with healthy doubt",cat:'Workhorse swaps',
   gloss:'『就一撮盐吞下』= 别全信——要对冲就用内容对冲,别撒调味料',
   hard:[],
   quote:"Your brain recognizes a familiar situation and instinctively maps it to a dead phrase — the dead-phrase reflex.",
   src:"Day 9 — the dead-phrase reflex",
   why:"The reflex example from the lecture itself: hedge with content, not with seasoning.",
   usage:["“Self-reported data — treat it with healthy doubt.”","Say WHY the doubt: small n, one site, self-report."]},
  {id:'u9w12',whyzh:'半句话就讨要认同,等于拆自己的台。把话说完；停顿自然会邀请回应。',term:"you know · right? → let silence ask",cat:'Workhorse swaps',
   gloss:"求认同的口头禅让观点显得心虚 —— 陈述完就停",
   hard:[["whittle away","一点点削掉"],["qualifier","(术语)限定/对冲语：you know, I feel like, that’s just my opinion"]],
   quote:"Qualifiers whittle away confidence and clarity — like a drop of food dye in clear water.",
   src:"BetterSpeak · Empty Language Index — qualifiers",
   why:"Asking for agreement mid-sentence undercuts the sentence. State it; the pause invites response.",
   usage:["Delete one “you know” per paragraph.","End the claim. Let the silence do the asking."]},
  {id:'u9w13',whyzh:'句子的开头是它最无意识的部分。晚半拍再开口,填充词就死了。',term:"um · uh · like · so → pause instead",cat:'Workhorse swaps',
   gloss:'四大填充词 —— um 是嘴在等脑子时的“加载音”；换成半拍沉默',
   hard:[["filler","(术语)填充词：嘴用来填空的声音"]],
   quote:"Fillers occur when we’re not fully conscious of our word choice — the mouth reaches for the most accessible sounds.",
   src:"BetterSpeak · Empty Language Index — the big four",
   why:"The start of a sentence is its most unconscious part. Start half a beat late and the filler dies.",
   usage:["Silence reads as confidence; “um” reads as loading.","Drill: one conversation today with deliberate half-beat starts."]},
  {id:'u9w14',whyzh:'用旧的隐喻暴露借来的分析。新鲜的词逼你真的去分析。',term:"secret sauce · Achilles heel → the real mechanism · the weak joint",cat:'Workhorse swaps',
   gloss:'“独门酱料”(=成功诀窍)和“阿喀琉斯之踵”——两个用得最滥的比喻；新鲜的词才逼你真正分析',
   hard:[["Achilles heel","阿喀琉斯之踵：致命弱点(本身是好典故,只是用滥了)"]],
   quote:"(Both on the Dead Phrases Index.)",
   src:"BetterSpeak · Dead Phrases Index",
   why:"Worn metaphors signal borrowed analysis. Fresh words force you to actually analyze.",
   usage:["“The weak joint is the matching step.”","“The mechanism is trust, not price.”"]},
  {id:'u9w15',whyzh:'用自己的话预告总结,听起来就已经新鲜了。',term:"in a nutshell → the short version",cat:'Workhorse swaps',
   gloss:"“一言以蔽之”的套话版 —— 用自己的话给摘要开头",
   hard:[],quote:"(On the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"Announce the summary in your own words and it already sounds fresher.",
   usage:["The short version: the effect is real but small.","Or skip the wrapper — just give the summary."]},
  {id:'u9w16',whyzh:'套话的生命周期：每一句死去的短语,都曾是新鲜的发明。去发明你自己的。',term:"blood, sweat, and tears → name the actual cost",cat:'Workhorse swaps',
   gloss:"1940 年它是天才原创(丘吉尔),如今是套话 —— 说出真实的代价",
   hard:[["toil","辛劳(丘吉尔原句：blood, toil, tears and sweat)"]],
   quote:"I have nothing to offer but blood, toil, tears and sweat.",
   src:"Winston Churchill (1940) — brilliant then, cliché now; on the Dead Phrases Index",
   why:"The life cycle of a cliché: every dead phrase was once a fresh invention. Invent your own.",
   usage:["“Two rebuilds and a lost summer” beats “blood, sweat, and tears.”","Specific costs are always fresher."]},
  {id:'u9w17',whyzh:'自相矛盾的短语,就是挂着自动驾驶说出来的短语。',term:"it goes without saying → then don’t say it",cat:'Workhorse swaps',
   gloss:"“不言而喻”—— 要么别说,要么直接说主张",
   hard:[],quote:"(On the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"A phrase that contradicts itself is a phrase on autopilot.",
   usage:["Drop the wrapper; state the claim.","If it truly goes without saying, silence works."]},
  {id:'u9w18',whyzh:'套话在回避承诺；一个日期创造承诺。',term:"time will tell → we’ll know by [when]",cat:'Workhorse swaps',
   gloss:"“时间会证明”是放弃预测 —— 说出具体的时间点",
   hard:[],quote:"(On the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"The cliché dodges commitment; a date creates it.",
   usage:["We’ll know by the October data release.","Deadlines are the articulate version of destiny."]},
  {id:'u9w19',whyzh:'没有宾语的“一致”只是一种感觉,不是一个共识。',term:"on the same page → aligned on X",cat:'Workhorse swaps',
   gloss:"“同一页”—— 说清到底在哪件事上一致",
   hard:[],quote:"(On the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"Alignment without an object is a feeling, not an agreement.",
   usage:["We’re aligned on the sample; still apart on the outcome measure.","Name the page, not the metaphor."]},
  {id:'u9w20',whyzh:'not rocket science 带着贬低；straightforward 提供信息。',term:"piece of cake · not rocket science → straightforward",cat:'Workhorse swaps',
   gloss:"两个“这很简单”的套话 —— straightforward 更准也更谦逊",
   hard:[],quote:"(Both on the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"“Not rocket science” belittles; “straightforward” informs.",
   usage:["The merge is straightforward — one key, two files.","Simple for you may not be simple for them."]},
  {id:'u9w21',whyzh:'把代价说出声,这个决定就更容易被承担。',term:"bite the bullet → accept the cost",cat:'Workhorse swaps',
   gloss:"“咬子弹”—— 直接说：接受这个代价",
   hard:[],quote:"(On the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"Say the cost out loud and the decision gets easier to own.",
   usage:["We accept the smaller sample and move on.","Name the bullet before you bite it."]},
  {id:'u9w22',whyzh:'体育习语把一半听众关在门外；时间词把所有人请进来。',term:"right off the bat → from the first minute",cat:'Workhorse swaps',
   gloss:"棒球黑话 —— from the first minute / immediately",
   hard:[],quote:"(On the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"Sports idioms exclude half your listeners; time words include everyone.",
   usage:["From the first minute, the referee flagged the framing.","Immediately is one word and always works."]},
  {id:'u9w23',whyzh:'具体的“多做了什么”才是赞美；里程数只是填充。',term:"go the extra mile → name the unasked-for extra",cat:'Workhorse swaps',
   gloss:"“多走一英里”—— 直接说做了什么分外之事",
   hard:[],quote:"(On the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"The specific extra is the compliment; the mileage is filler.",
   usage:["She re-ran the whole pipeline overnight — unasked.","Praise deeds, not distance."]},
  {id:'u9w24',whyzh:'整个索引里最纯粹的减法示范。',term:"in this day and age → today",cat:'Workhorse swaps',
   gloss:"五个音节换一个词：today",
   hard:[],quote:"(On the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"The purest subtraction demo in the whole index.",
   usage:["Today, replication is expected.","Same meaning, four words cheaper."]},
  {id:'u9w25',whyzh:'开口即代表你自己；这个免责声明只会折损你的底气。',term:"in my opinion · me personally → (delete)",cat:'Workhorse swaps',
   gloss:"你说的话当然是你的观点 —— 直接说主张,声明反而减分",
   hard:[],quote:"(On the Dead Phrases Index — and cousins of the qualifier family.)",src:"BetterSpeak · Dead Phrases Index",
   why:"Ownership is implied by speaking; the disclaimer only withdraws confidence.",
   usage:["“The mechanism is trust.” Full stop.","Save the hedge for genuine uncertainty — then hedge with content."]},
  {id:'u9w26',whyzh:'借来的现成意象把句子外包了；朴素的动词把它拿回来。',term:"spill the beans · ball in your court → tell us · your call now",cat:'Workhorse swaps',
   gloss:"两个借来的隐喻：直接说“告诉我们”/“现在由你决定”",
   hard:[],quote:"(Both on the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"Borrowed game imagery outsources your sentence; plain verbs own it.",
   usage:["Your call now — we’ve sent the revised draft.","Just tell us what the committee decided."]},
  {id:'u9w27',whyzh:'范围词只有在范围被点名时才有用。',term:"across the board · big picture → in every group · the whole argument",cat:'Workhorse swaps',
   gloss:"“全线”说清范围：in every group / at every level;“大局”说清对象：the whole argument / the full system",
   hard:[],quote:"(Both on the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"Scope words are only useful when the scope is named.",
   usage:["Prices rose in every category we track.","Zoom out to the whole argument: does the mechanism survive?"]},
  {id:'u9w28',whyzh:'没有第一步的势头语言是愿望,不是计划。',term:"get the ball rolling · take it to the next level → start · name the level",cat:'Workhorse swaps',
   gloss:"“把球滚起来”= start(说清第一步是什么);“下一个层次”——哪个层次？说出来",
   hard:[],quote:"(Both on the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"Momentum language without a first step is a wish, not a plan.",
   usage:["Let’s start: I’ll draft the intro tonight.","Next level = a second data source, specifically."]},
  {id:'u9w29',whyzh:'假装谦虚的“轻描淡写”和注水的“十有八九”(in all likelihood),都在模糊你的真实估计。',term:"to say the least · in all likelihood → (delete) · probably",cat:'Workhorse swaps',
   gloss:"to say the least 是装谦虚的强调,多半可删；in all likelihood 五音节 = probably 三音节",
   hard:[],quote:"(Both on the Dead Phrases Index.)",src:"BetterSpeak · Dead Phrases Index",
   why:"Understatement theater and inflated probability both blur the estimate.",

  {id:'u9w30',whyzh:'把索引里剩下的零碎一网打尽：每一个都有朴素、具体的替换。',term:"ins and outs · on my radar · huge fan · wow factor → (say the real thing)",cat:'Workhorse swaps',

  {id:'u9w31',whyzh:'本单元最深的诊断：说话起雾不是文风问题,是诚意问题。动机清了,词自己会清。',term:'like a cuttlefish spurting out ink',cat:'Quotes',
   gloss:"『像乌贼喷墨』—— 词不由衷时,人会本能地喷出长词和废话来遮掩",
