  craft:"Misdirection in one clause: the setup sounds retrospective, the punchline claims the future. At 83, “half point” is both a laugh and a declaration — I'm not done. And note: zero throat-clearing, the joke IS the first sentence.",
  craftzh:"一个从句完成预期反转：前半句像在回顾人生,后半句宣布未来。83 岁说“职业生涯中场”,既是笑点也是宣言——我还没完。注意他零寒暄,第一句话就是笑点。",
  steal:"Template: receiving a [big honor] at the half point of my [career / journey] — claim the future inside the joke."},
 {gap:"— “I also am quite humbled…” —",fn:"The inversion",fnzh:"反转致敬",exact:true,url:"https://youtu.be/Wdkkk9ebKY0?t=40",
  quote:"I'm in a room of actors, many of whom are here because they've been nominated to receive a prize for their amazing work — while I'm here to receive a prize for being alive.",
  craft:"Self-deprecation that flatters the room: he drops himself one notch and lifts everyone else. The contrast frame — their amazing work vs my being alive — makes the audience the hero of his own award.",
  craftzh:"用自嘲抬举全场：把自己压低一格,同时把别人抬高一格。“你们凭杰作获奖/我凭活着获奖”——笑点冲自己,敬意给别人,把观众变成了他这座奖的主角。",
  steal:"At any award or toast: they are here for X; I am merely here for Y. Lower yourself, honor the room."},
 {gap:"— thanks to Woody Harrelson and SAG-AFTRA; then back to the beginning: college, a little lost —",fn:"The turn",fnzh:"脆弱转折",exact:true,url:"https://youtu.be/mEPIO1EqYwg?t=31",
  quote:"I was failing at school. I felt isolated, alone. And then I found the company of people putting on plays. People I once thought were misfits and geeks turned out to be my people. … I struggled for about 15 years, going from acting job to carpentry and back to acting.",
  craft:"The pivot from funny to true. Credibility comes from concrete nouns (carpentry, plays) and short flat sentences — no adjectives begging for sympathy. “My people” quietly plants the seed the ending will harvest.",
  craftzh:"从好笑转向真实的枢纽。可信度来自具体名词(木工、话剧)和不带形容词的短句——绝不乞求同情。“my people”在此埋下伏笔,结尾要来收割。",
  steal:"After two laughs you have earned the right to be serious: one concrete low point, plain nouns, no self-pity."},
 {gap:"— those fifteen years bring him to the work itself: “the work I do with other actors is one of the great joys of my life” —",fn:"The thesis",fnzh:"论点",exact:true,url:"https://youtu.be/2syAO_n2hR8?t=48",
  quote:"Ours is a tough business to get into. In my case, it's been a tough business to get out of — thank God, because I love what I do.",
  craft:"The point of the whole speech, delivered as a mirror joke: get into / get out of. One inversion carries gratitude, humor, and a work ethic in a single breath.",
  craftzh:"全篇论点,用一个镜像笑话说出：难进的行业/难退出的行业。一次镜像对调,同时装下感激、幽默与敬业。",
  steal:"Mirror template: X is hard to get into; in my case it has been hard to get out of."},
 {gap:"— acting lets you live many lives, he says; thanks to Lucas, Spielberg, Fred Roos, his manager — and success, he says, brings responsibility —",fn:"The outward turn",fnzh:"向外升华",exact:false,url:"https://www.youtube.com/results?search_query=Harrison+Ford+SAG+speech+keep+the+door+open+lost+boy",
  quote:"Success in this business brings a certain freedom that comes with the responsibility to support each other — to lift others up when we can, to keep the door open for the next kid, the next lost boy who's looking for a place to belong.",
  craft:"The camera turns from me to us. “The next lost boy” is a callback — the lost boy of Beat 3 (isolated, alone) was him. A callback at the climax makes a speech feel designed, not assembled.",
  craftzh:"镜头从“我”转向“我们”。“the next lost boy”是一记 callback——第三拍里那个 isolated, alone 的人就是他自己。在高潮处回收伏笔,整篇立刻有了设计感。",
  steal:"Close the loop: whatever you confessed in the middle, hand it forward at the end — keep the door open for the next [who you once were]."},
 {gap:"— the obligation paid, he counts his luck —",fn:"The crescendo",fnzh:"重复升温",exact:true,url:"https://youtu.be/mEPIO1EqYwg?t=101",
  quote:"I'm indeed a lucky guy. Lucky to have found my people. Lucky to have work that challenges me. Lucky to still be doing it. And I don't take that for granted.",
  craft:"Anaphora does the emotional climb: lucky, lucky, lucky — each repeat more specific — then a hard stop (I don't take that for granted) presses the weight down. Same engine as MLK's dreams; see the Anaphora unit.",
  craftzh:"首语反复负责把情绪抬上去：三个 lucky 一个比一个具体,然后一记刹车(I don't take that for granted)把分量压实。和 MLK 的 dream 是同一台发动机——参见 Anaphora 单元。",
  steal:"Gratitude ladder: I am lucky — lucky to A, lucky to B, lucky to still C. Then one flat sentence to seal it."},
 {gap:"— and to those closest —",fn:"The soft landing",fnzh:"克制收尾",exact:true,url:"https://youtu.be/2syAO_n2hR8?t=58",
  quote:"To my extraordinary, beautiful wife, Calista, for giving me love and courage through all of it. Thank you to SAG-AFTRA for honoring me with this prize. … This is very encouraging.",
  craft:"After tears, a four-word understatement: this is very encouraging. Comic deflation as a landing — the room laughs, the emotion stays. Downward inflection, full stop, walk off (Day 6: endings).",
  craftzh:"泪点之后,四个词的轻描淡写：This is very encouraging。用喜剧式泄压完成着陆——全场笑了,情绪却留住了。降调、句号、转身下台(参见 Day 6 结尾课)。",
  steal:"End big moments small: one dry understatement right after the emotional peak. The contrast does the work."}],
 arc:"Lower yourself, honor the room, tell the truth, name the point, climb by repetition, hand it forward, land soft. Two jokes buy permission; one confession buys trust; the callback ties the whole thing; the understatement lets everyone breathe.",
 arczh:"先压低自己、抬举全场；再讲真话、点明论点；用重复抬升情绪；把门留给后来人；最后轻轻落地。两个笑点买来许可,一次坦白买来信任,一记 callback 收拢全篇,一句轻描淡写,让全场松了口气。"},
{id:"st2",bio:"史蒂夫·乔布斯,苹果与皮克斯创始人。2005年6月斯坦福毕业典礼,时年50岁,确诊胰腺癌近两年后——他一生唯一一次毕业演讲:没有幻灯片,三个故事,讲完就走。常被称为观看量最高的毕业演讲。",speaker:"Steve Jobs",title:"Steve Jobs — Stanford Commencement (2005)",sub:"15-minute commencement · 8 beats",hookterm:"Stay hungry. Stay foolish.",hook:"Stay hungry. Stay foolish. And I have always wished that for myself. And now, as you graduate to begin anew, I wish that for you.",hooksrc:"Steve Jobs, Stanford Commencement (2005)",hookurl:"https://youtu.be/UF8uR6Z6KLc?t=845",
 intro:"One joke, one map, three stories — each ending in a distilled principle — then a charge, and an ending borrowed from a 1974 magazine. The most imitated speech architecture of the century.",
 introzh:"一个笑点、一张地图、三个故事——每个故事收在一条提炼出的原则上——然后是嘱托,和一个借自 1974 年杂志的结尾。本世纪被模仿最多的演讲结构。",
 beats:[
 {fn:"Opening joke",fnzh:"自嘲破冰",exact:true,url:"https://youtu.be/UF8uR6Z6KLc?t=32",
  quote:"Truth be told, I never graduated from college. And this is the closest I've ever gotten to a college graduation.",
  craft:"The world's most famous dropout opens by handing the room his weakest fact. Same move as Ford's “prize for being alive”: give away the joke about yourself before anyone else can make it.",
  craftzh:"世界上最有名的辍学生,开口先把自己最弱的一张牌摊给全场。和 Ford 的“凭活着获奖”同一招：关于你自己的笑话,抢在别人前面自己讲。",
  steal:"Open with the fact you'd least like introduced about you — told as a joke, it becomes armor."},
 {fn:"The map",fnzh:"结构宣告",exact:true,url:"https://youtu.be/UF8uR6Z6KLc?t=44",
  quote:"Today I want to tell you three stories from my life. That's it. No big deal. Just three stories.",
  craft:"Numerical ordering (Day 12) plus radical humility: the structure is promised in one breath, and “no big deal” lowers the ceremony to eye level. The audience now has the map and relaxes.",
  craftzh:"数字排序(Day 12)+彻底放低身段：一口气把结构承诺给听众,一句 no big deal 把典礼降到平视高度。地图在手,全场松弛。",
  steal:"Announce your structure in under ten words, then deflate it: just three stories."},
 {gap:"— all of story one is elided: “it started before I was born” — the adoption, the promise he would go to college, dropping out, Coke-bottle deposits, and the calligraphy class that resurfaced in the Mac's typography —",fn:"Story one lands",fnzh:"故事一落点",exact:true,url:"https://youtu.be/UF8uR6Z6KLc?t=294",
  quote:"You can't connect the dots looking forward; you can only connect them looking backwards. So you have to trust that the dots will somehow connect in your future.",
  craft:"Ten minutes of biography (dropping out, Coke-bottle deposits, a calligraphy class) compress into one transferable principle with its own image. The story is the evidence; the dots are the takeaway.",
  craftzh:"十分钟的自传(辍学、退可乐瓶换钱、书法课)压缩成一条带自有意象的可迁移原则。故事是证据,“连点”是结论——每个故事都要有一句能被带走的话。",
  steal:"End every story with its principle, and give the principle a picture (the dots)."},
 {gap:"— the dots close story one; story two: Apple in a garage at 20, fired at 30 (“very publicly out”), then NeXT, Pixar, Laurene: “I had been rejected, but I was still in love” —",fn:"Story two's brick",fnzh:"故事二的砖头",exact:true,url:"https://youtu.be/UF8uR6Z6KLc?t=485",
  quote:"Sometimes life hits you in the head with a brick. Don't lose faith. I'm convinced that the only thing that kept me going was that I loved what I did.",
  craft:"Getting fired from your own company, rendered as a brick to the head — pain made concrete and almost funny, so the sincerity after it (don't lose faith) lands clean.",
  craftzh:"被自己创办的公司开除,写成“一块砖头砸中脑袋”——疼痛被具体化、甚至有点好笑,后面的真诚(别失去信念)才落得干净。",
  steal:"Name your setback as a physical object; the comedy of the image buys the sincerity that follows."},
 {gap:"— story two actually lands on “keep looking, don't settle”; story three opens with a quote he read at 17: live each day as if it were your last —",fn:"The mirror question",fnzh:"镜前之问",exact:true,url:"https://youtu.be/UF8uR6Z6KLc?t=561",
  quote:"If today were the last day of my life, would I want to do what I am about to do today? And whenever the answer has been no for too many days in a row, I know I need to change something.",
  craft:"Story three opens with a ritual anyone can copy tomorrow morning — the speech stops being about him and becomes an instrument the listener takes home.",
  craftzh:"第三个故事以一个人人明早就能照做的仪式开场——演讲从“他的故事”变成“你带回家的工具”。",
  steal:"Give the audience a repeatable ritual, phrased as the exact question you ask yourself."},
 {gap:"— remembering he will be dead soon is, he says, the most important tool he has ever encountered for the big choices —",fn:"The hard turn",fnzh:"生死直言",exact:true,url:"https://youtu.be/UF8uR6Z6KLc?t=586",
  quote:"Almost everything — all external expectations, all pride, all fear of embarrassment or failure — these things just fall away in the face of death… Remembering that you are going to die is the best way I know to avoid the trap of thinking you have something to lose. You are already naked. There is no reason not to follow your heart.",
  craft:"Abstractions fall away in a triple (pride, embarrassment, failure) and what remains is stated in the plainest possible words: already naked. Maximum stakes, minimum vocabulary.",
  craftzh:"虚饰在一个三连(骄傲、难堪、失败)里剥落,剩下的用最平的词说出：already naked。最大的赌注,最小的词汇量。",
  steal:"At your heaviest point, shorten the sentences and ban every ornament — nakedness reads as truth."},
 {gap:"— only now the diagnosis story: the scan, “get your affairs in order” (doctor's code for prepare to die), the biopsy where the doctor cried because it was curable — then: death is very likely the single best invention of life —",fn:"The charge",fnzh:"嘱托",exact:true,url:"https://youtu.be/UF8uR6Z6KLc?t=745",
  quote:"Your time is limited, so don't waste it living someone else's life. Don't be trapped by dogma… Don't let the noise of others' opinions drown out your own inner voice. And most important, have the courage to follow your heart and intuition.",
  craft:"Negative anaphora — three don'ts — sweeps the ground clear before the single positive command (follow your heart and intuition). Clearing before building, exactly like Kennedy's “not… not…” patterns.",
  craftzh:"否定式首语反复——三个 don't——先清场,再立那条唯一的正面指令(跟随内心与直觉)。先破后立——和肯尼迪的 not… not… 句式如出一辙。",
  steal:"Stack three don'ts before your one do — prohibition gives the command its silhouette."},
 {gap:"— he introduces the Whole Earth Catalog: Stewart Brand, typewriters and Polaroids, “like Google in paperback form, 35 years before Google” —",fn:"The borrowed ending",fnzh:"借来的结尾",exact:true,url:"https://youtu.be/UF8uR6Z6KLc?t=831",
  quote:"On the back cover of their final issue was a photograph of an early morning country road… Beneath it were the words: ‘Stay Hungry. Stay Foolish.’ It was their farewell message as they signed off. And I have always wished that for myself.",
  craft:"He does not write his ending — he retrieves it from a magazine he read at your age, credits it, and hands it over as his final words. The commonplace book, performed live: the best ending is often one you collected.",
  craftzh:"他没有“写”结尾——他从自己在你们这个年纪时读过的一本杂志里取出它,注明出处,然后交给你们。这就是 commonplace book 的现场演出：最好的结尾常常是你收藏来的。",
  steal:"End on a collected line, with its provenance — the credit does not weaken the ending, it doubles it."}],
 arc:"A joke buys the room, a map relaxes it, three stories each pay off in one imaged principle, three don'ts clear the ground for one do, and a collected quote — credited — carries the landing. Structure so clean it became the template for every commencement since.",
 arczh:"一个笑点买下全场,一张地图让人松弛；三个故事各自兑付一条带画面的原则；三个 don't 清场,托出一个 do;最后由一句注明出处的收藏名言完成着陆。结构干净到成了此后所有毕业演讲的模板。"},
{id:"st3",bio:"肯·罗宾逊爵士(1950–2020),英国教育学者,创造力教育的头号布道者。2006年TED大会演讲《学校扼杀创造力吗?》,TED网站上线时的首批六支演讲之一——如今是TED史上观看量第一(6500万+),每分钟两个笑点,用脱口秀的皮讲教育改革的骨。",speaker:"Ken Robinson",title:"Ken Robinson — Do Schools Kill Creativity? (TED, 2006)",sub:"18-minute TED talk · 7 beats · the most-watched TED ever",hookterm:"prepared to be wrong",hook:"If you're not prepared to be wrong, you'll never come up with anything original.",hooksrc:"Ken Robinson, TED (2006)",hookurl:"https://youtu.be/iG9CE55wbtY?t=340",
 intro:"The most-watched TED talk in history, and it has no slides — only stories and roughly two laughs a minute, every one of them carrying the argument. This is the master file for humor in service of a thesis.",
 introzh:"史上观看量最高的 TED,没有一页 PPT——只有故事和平均每分钟两个笑点,而且每个笑点都在运送论点。这是“幽默为论点服务”的范本。",
 beats:[
 {fn:"The cold open",fnzh:"冷开场",exact:true,url:"https://youtu.be/iG9CE55wbtY?t=21",
  quote:"Good morning. How are you? It's been great, hasn't it? I've been blown away by the whole thing. In fact, I'm leaving.",
  craft:"Three beats of sincere compliment, then the absurd exit — the comic triple in its purest form (two straight, one twist). Fifteen seconds in, the room has laughed and lowered its guard.",
  craftzh:"三拍真诚的赞美,第四拍荒诞离场——喜剧三连的最纯形态(两正一歪)。开讲十五秒,全场已经笑过、卸防完毕。",
  steal:"Compliment the occasion twice, truthfully — then push the compliment one step past reason."},
 {gap:"— four minutes elided: the conference's three themes, his stated thesis — “creativity is as important in education as literacy” — capped with “That was it, by the way… so, 15 minutes left”; then the girl drawing God, and the nativity play (“Frank sent this”) —",fn:"The thesis with laughs",fnzh:"带笑点的论点",exact:true,url:"https://youtu.be/iG9CE55wbtY?t=340",
  quote:"Kids will take a chance. If they don't know, they'll have a go. They're not frightened of being wrong… If you're not prepared to be wrong, you'll never come up with anything original.",
  craft:"The thesis arrives on the back of a story about a girl drawing God (“They will in a minute”). The joke and the argument are the same sentence pattern — you laugh, then realize you agreed.",
  craftzh:"论点骑在一个小女孩画上帝的故事背上进场(“他们马上就知道了”)。笑话和论证共用同一个句式——你笑完才发现自己已经同意了。",
  steal:"Deliver your thesis within sixty seconds of a laugh — agreement rides in on the exhale."},
 {gap:"— being wrong becomes institutional: “we stigmatize mistakes”; then Picasso — all children are born artists —",fn:"The reversal",fnzh:"一句翻转",exact:true,url:"https://youtu.be/iG9CE55wbtY?t=382",
  quote:"We don't grow into creativity, we grow out of it. Or rather, we get educated out of it.",
  craft:"Two reversals in one breath: grow into/out of, then the self-correction (“or rather”) that sharpens the blame — educated out. The rephrasing performs thinking-live, which makes it feel discovered, not scripted.",
  craftzh:"一口气两次反转：grow into/out of 的对调,再用 or rather 自我修正、把矛头磨尖(是被教育掉的)。现场改口的姿态让它听起来像当场想到,而非写好的稿。",
  steal:"Say it, then correct yourself toward the sharper verb — “or rather” is a spotlight."},
 {gap:"— from Stratford to LA, via Snitterfield, where Shakespeare's father was born: “you don't think of Shakespeare having a father, do you?” —",fn:"The absurd zoom",fnzh:"荒诞特写",exact:true,url:"https://youtu.be/iG9CE55wbtY?t=404",
  quote:"You don't think of Shakespeare being a child, do you? Shakespeare being seven? He was in somebody's English class, wasn't he? How annoying would that be?",
  craft:"Take a marble statue and imagine it at seven, in homework trouble — the incongruity is the joke, and the joke is the point: every genius was once a child some system could have crushed.",
  craftzh:"把一尊大理石雕像想象成七岁、正被英语作业折磨——错位即笑点,而笑点就是论点：每个天才都曾是某个体制差点碾掉的小孩。",
  steal:"Shrink an untouchable figure to age seven and put them in an ordinary scene — reverence dissolves, argument remains."},
 {gap:"— then the claim underneath: every education system on earth has the same hierarchy — math on top, the arts at the bottom, dance last —",fn:"The naked comparison",fnzh:"裸对比",exact:true,url:"https://youtu.be/iG9CE55wbtY?t=539",
  quote:"There isn't an education system on the planet that teaches dance every day to children the way we teach them mathematics. Why? Why not?",
  craft:"No statistics — one planetary-scale comparison and two tiny questions. The double question (Why? Why not?) shifts the burden of proof to the status quo.",
  craftzh:"不引数据——一个行星尺度的对比,加两个极短的问句。双问(Why? Why not?)把举证责任整个推给现状。",
  steal:"Ask why, pause, then ask why not — the second question does the arguing."},
 {gap:"— six minutes elided: education's real product is university professors; a system built for industrialism; academic inflation; intelligence is diverse, dynamic, distinct — which brings him to a 1930s schoolgirl the school called hopeless —",fn:"The story as proof",fnzh:"故事即论据",exact:true,url:"https://youtu.be/iG9CE55wbtY?t=944",
  quote:"He said, Gillian isn't sick — she's a dancer. Take her to a dance school. … She's been responsible for some of the most successful musical theater productions in history. Somebody else might have put her on medication and told her to calm down.",
  craft:"The Gillian Lynne story is the talk's entire evidence base, and it works because of the last line — the counterfactual. One sentence imagines the world where the thesis is false, and it chills.",
  craftzh:"Gillian Lynne 的故事就是全篇的证据链,而它成立靠的是最后一句——那个反事实：一句话想象论点不成立的世界,让人脊背发凉。",
  steal:"End your best story with the counterfactual: somebody else might have… — the road not taken proves the road."},
 {gap:"— Al Gore's ecology prompts “human ecology”; “our education system has mined our minds the way we strip-mine the earth”; a Jonas Salk line, then the gift of imagination —",fn:"The charge",fnzh:"嘱托",exact:true,url:"https://youtu.be/iG9CE55wbtY?t=1142",
  quote:"Our task is to educate their whole being, so they can face this future. By the way — we may not see this future, but they will. And our job is to help them make something of it.",
  craft:"After eighteen minutes of laughter, the ending goes quiet and hands the future to the children — the same outward turn as Ford's “next lost boy.” The humor was the vehicle; this is the cargo.",
  craftzh:"笑了十八分钟之后,结尾安静下来,把未来交到孩子们手里——和 Ford 的 next lost boy 同一记向外转。幽默是载具,这才是货物。",
  steal:"If the whole talk was funny, end on one quiet paragraph — the register drop is your crescendo."}],
 arc:"A cold open earns the laugh, the laugh smuggles the thesis, reversals and absurd zooms keep the argument airborne, one story carries all the evidence, and the ending goes quiet to unload the cargo. Two laughs a minute, zero wasted jokes.",
 arczh:"冷开场赢得笑声,笑声偷运论点；反转句和荒诞特写让论证一直悬在空中；一个故事扛起全部证据；结尾安静下来,把真正的分量放下。每分钟两个笑点,没有一个是白笑的。"},
{id:"st4",bio:"马尔科姆·格拉德威尔,《纽约客》专职撰稿人,《引爆点》《异类》作者,把社科研究讲成侦探小说的当代第一人。TED 2004:他不讲大理论,讲一个叫霍华德·莫斯科维茨的意面酱顾问——从小事切入讲大道理的教科书。",speaker:"Malcolm Gladwell",title:"Malcolm Gladwell — Choice, Happiness and Spaghetti Sauce (TED, 2004)",sub:"18-minute TED talk · 7 beats · the entry-point masterclass",hookterm:"the perfect Pepsis",hook:"They were looking for the perfect Pepsi, and they should have been looking for the perfect Pepsis.",hooksrc:"Malcolm Gladwell, TED (2004)",hookurl:"https://youtu.be/iIiAAhUeR6Y?t=258",
 intro:"Asked to talk about happiness, he talks about a short round man who studied spaghetti sauce — and lands on happiness anyway. The definitive demonstration of the Gladwell entry: open on an oddly specific small thing, make the ordinary fascinating, then cash the big idea.",
 introzh:"命题是“幸福”,他却讲了一个研究意面酱的矮个子——最后仍然落回幸福。这就是“Gladwell 式进场”的定版示范：从一个具体到奇怪的小切口进场,把平常之物讲出味道,最后兑现大观点。",
 beats:[
 {fn:"The swerve open",fnzh:"偏题开场",exact:true,url:"https://youtu.be/iIiAAhUeR6Y?t=40",
  quote:"I think I was supposed to talk about my new book… Instead I want to talk about somebody who has done as much to make Americans happy as perhaps anyone over the last 20 years — a personal hero of mine: a man named Howard Moskowitz, who is most famous for reinventing spaghetti sauce.",
  craft:"He announces the expected topic, discards it in one clause, and hands the biggest abstraction in the room (happiness) to the smallest possible carrier (sauce). The gap between “hero” and “spaghetti sauce” IS the hook — you have to know why.",
  craftzh:"先报出大家以为的题目,一个从句把它丢掉,然后把全场最大的抽象(幸福)交给最小的载体(意面酱)。“英雄”和“意面酱”之间的落差本身就是钩子——你不听下去不行。",
  steal:"Announce the big topic, then swap in an absurdly small protagonist: I want to talk about happiness — so let me tell you about a man who studied X."},
 {fn:"The character sketch",fnzh:"人物速写",exact:true,url:"https://youtu.be/iIiAAhUeR6Y?t=66",
  quote:"Howard's about this high, and he's round, and he's in his 60s, and he has big huge glasses and thinning gray hair, and he has a kind of wonderful exuberance and vitality.",
  craft:"Before a single idea arrives, the hero gets a body: height gesture, glasses, hair, energy. Ideas travel inside people — thirty seconds of physical detail buys twenty minutes of attention for the abstractions that follow.",
  craftzh:"任何观点出场之前,主角先有了身体：比划的身高、眼镜、头发、精气神。思想装在人身上才走得远——三十秒的外貌细节,为后面二十分钟的抽象买足了注意力。",
  steal:"Give your protagonist three physical details and one temperament word before you let them think."},
 {gap:"— a parrot, the opera, medieval history; psychophysics, he shrugs, is about measuring things — then a consulting shop in White Plains, and the client calls —",fn:"The quest",fnzh:"谜题铺设",exact:true,url:"https://youtu.be/iIiAAhUeR6Y?t=122",
  quote:"Pepsi came to Howard and they said, we want you to figure out the perfect amount of sweetener for a can of Diet Pepsi — somewhere between 8 and 12 percent — and the data came back a mess. It didn't make any sense.",
  craft:"A concrete client, a bounded question (8 to 12 percent aspartame), and a result that refuses to behave — the detective structure. The mess is essential: no anomaly, no story.",
  craftzh:"具体的客户、有边界的问题(8% 到 12% 的甜度)、一份不听话的数据——侦探小说的骨架。那团乱麻是必需品：没有反常,就没有故事。",
  steal:"Set up your finding as a bounded question plus data that made no sense — the anomaly recruits the audience as co-detectives."},
 {gap:"— most testers would have shrugged and picked 10 percent; the mess nags Howard for years, until the answer hits him in a White Plains diner —",fn:"The plural",fnzh:"一个复数",exact:true,url:"https://youtu.be/iIiAAhUeR6Y?t=258",
  quote:"They were looking for the perfect Pepsi, and they should have been looking for the perfect Pepsis. … There is no perfect pickle; there are only perfect pickles.",
  craft:"The entire intellectual payload rides on one letter: an s. Years of confusion resolved by pluralizing a noun — the smallest possible edit staged as an epiphany, then immediately re-proven on a second food.",
  craftzh:"整个思想的分量压在一个字母上：一个 s。多年的困惑,靠把名词变复数解决——最小的编辑被演成顿悟,然后立刻在第二种食物上复验一遍。",
  steal:"If your idea fits in a grammatical change (a plural, a tense, a preposition), stage that change as the reveal."},
 {gap:"— years of blank stares (“nobody would hire him”) until Campbell's brings him Prego: he cooks 45 spaghetti sauces, trucks Americans into halls by the thousand, and the data falls into three clusters — plain, spicy, extra chunky —",fn:"The hidden third",fnzh:"藏起来的三分之一",exact:true,url:"https://youtu.be/iIiAAhUeR6Y?t=482",
  quote:"One third of Americans like their spaghetti sauce extra chunky — and yet, no one was talking about extra chunky. Because they don't know what they want. You cannot always ask people what they want.",
  craft:"The twist inside the twist: the biggest preference cluster was invisible because asking is the wrong instrument. A methods lecture (revealed vs stated preference) smuggled inside a sauce anecdote — an empirical researcher's daily bread, told through dinner.",
  craftzh:"反转里的反转：最大的偏好群体是隐形的,因为“问”本身就是错误的仪器。一堂方法论课(显示性偏好 vs 陈述性偏好)被偷运进酱料轶事里——做实证研究的人的日常,只是换成了晚餐讲出来。",
  steal:"Land your methodological point as a story twist: the data knew something the people themselves could not say."},
 {gap:"— extra chunky takes 600 million dollars; then Howard's other lessons: mustard is horizontal, not a ladder (the Grey Poupon story), and the industry's imaginary “platonic dish” —",fn:"The zoom out",fnzh:"从酱到科学",exact:true,url:"https://youtu.be/iIiAAhUeR6Y?t=915",
  quote:"They were looking for universals — because all of science in the twentieth century was looking for universals. What Howard did was say: I don't know how to make sense of this unless we embrace the variability of human beings.",
  craft:"Only now, with the audience fully fed, does the sauce story swell to its real size: a critique of how a whole century did science. Earn the zoom-out with twelve minutes of concreteness first.",
  craftzh:"直到听众被喂饱,酱料故事才膨胀到它真正的尺寸：对整个二十世纪科学范式的批评。先用十二分钟的具体,才配得上这一次拉远。",
  steal:"Delay your grand claim until the small story has fully landed — then one sentence of zoom-out feels earned, not grandiose."},
 {gap:"— one last illustration: split the room into coffee clusters and satisfaction jumps from 60 to 78 — the gap between coffee that makes you wince and coffee that makes you deliriously happy —",fn:"The ring closes",fnzh:"回环收口",exact:true,url:"https://youtu.be/iIiAAhUeR6Y?t=1040",
  quote:"That is the final, and I think most beautiful, lesson of Howard Moskowitz: in embracing the diversity of human beings, we will find a surer way to true happiness.",
  craft:"The word from the discarded opening — happiness — walks back in as the final word. The swerve was a loan, repaid with interest: the talk was about happiness all along, and the sauce was the proof.",
  craftzh:"开场被丢掉的那个词——幸福——在最后一句走了回来。偏题原来是一笔借款,连本带息归还：这场演讲从头到尾都在讲幸福,意面酱只是证据。",
  steal:"Whatever you swerved away from in the opening, return to it in the final sentence — the loop is what makes the swerve feel designed."}],
 arc:"Promise the big topic, swap in a tiny hero, give him a body, hand him a puzzle, resolve it with a plural, twist it with a hidden third, zoom out to a century of science, and let the discarded word close the ring. The Gladwell entry, start to finish.",
 arczh:"许诺大题目,换上小主角；先让他有血有肉,再给他谜题；用一个复数解谜,用藏起来的三分之一再反转；拉远到整个世纪的科学,最后让开场丢掉的那个词回来收环。The Gladwell entry,从头到尾的完整示范。"},
{id:"st5",bio:"威廉·麦克雷文,四星海军上将,前美军特种作战司令部司令——2011年击毙本·拉登的“海神之矛”行动正是他指挥。2014年5月回到母校得州大学奥斯汀分校做毕业演讲:十条海豹突击队训练教给他的人生课,从“叠好你的床”讲起,全球疯传。",speaker:"William H. McRaven",title:"Adm. McRaven — Make Your Bed (UT Austin, 2014)",sub:"19-minute commencement · 8 beats · the parallel-structure showcase",hookterm:"start off by making your bed",hook:"If you want to change the world, start off by making your bed.",hooksrc:"William H. McRaven, University of Texas commencement (2014)",hookurl:"https://youtu.be/pxBQLFLei70?t=322",
 intro:"Ten lessons, one refrain — “If you want to change the world…” — repeated until it becomes scaffolding. This is what numerical ordering plus anaphora look like when they carry an entire speech.",
 introzh:"十条教训,一句副歌——If you want to change the world…——重复到成为脚手架。数字排序+首语反复扛起整场演讲,就是这个样子。",
 beats:[
 {fn:"The thesis",fnzh:"论点先行",exact:true,url:"https://youtu.be/pxBQLFLei70?t=163",
  quote:"Changing the world can happen anywhere, and anyone can do it… one decision, one person. What starts here can indeed change the world.",
  craft:"He takes the university's own slogan (What starts here changes the world) and adopts it as his thesis — borrowing the room's language earns instant ownership of the room.",
  craftzh:"他把学校自己的校训(What starts here changes the world)拿来当论点——借用全场共有的语言,一瞬间就把全场攥在了手里。",
  steal:"Open by quoting the audience's own motto back at them, then promise to prove it."},
 {gap:"— a caveat first: these lessons apply whether or not you ever wear a uniform — “our struggles in this world are similar” —",fn:"The syllabus",fnzh:"课程表",exact:true,url:"https://youtu.be/pxBQLFLei70?t=256",
  quote:"Basic SEAL training is six months of long, torturous runs, freezing cold swims… of constant stress, chaos, failure, and hardships. Here are the ten lessons I learned from basic SEAL training that hopefully will be of value to you.",
  craft:"Numerical ordering at maximum scale: ten points, announced up front. The promise of a count keeps a nineteen-minute speech feeling navigable — you always know where you are.",
  craftzh:"数字排序的最大规格：十个要点,开场先报数。有了计数的承诺,十九分钟的演讲始终让人知道自己走到了哪里。",
  steal:"For a long talk, announce the count first — the audience will carry the map for you."},
 {gap:"— the scene: Vietnam-veteran instructors inspecting square corners every morning — “it seemed a little ridiculous… we were aspiring to be real warriors” —",fn:"Lesson one anchors",fnzh:"第一课定锚",exact:true,url:"https://youtu.be/pxBQLFLei70?t=322",
  quote:"If you make your bed every morning, you will have accomplished the first task of the day… And it will reinforce the fact that the little things in life matter. If you can't do the little things right, you will never do the big things right.",
  craft:"The smallest imaginable act (a bed) carries the speech's whole philosophy (little things first). Lesson one is deliberately the humblest — the bathos IS the hook, and it gave the speech its name.",
  craftzh:"用能想到的最小动作(叠被子)承载全篇哲学(先做好小事)。第一课刻意选得最卑微——落差本身就是钩子,而且整场演讲的名字也由此而来。",
  steal:"Lead with your most mundane example, stated with full solemnity — the drop does the work."},
 {gap:"— lesson two's setup: seven-man rubber boats, ten-foot winter surf, every paddle synchronized —",fn:"The refrain engine",fnzh:"副歌引擎",exact:true,url:"https://youtu.be/pxBQLFLei70?t=416",
  quote:"You can't change the world alone — you will need some help… If you want to change the world, find someone to help you paddle.",
  craft:"Every lesson snaps shut on the same clause: If you want to change the world… Ten repetitions turn a phrase into architecture — anaphora stretched across an entire speech instead of a sentence.",
  craftzh:"每一课都合在同一个从句上：If you want to change the world…。十次重复把一个短语变成了建筑结构——首语反复从句子尺度放大到整场演讲。",
  steal:"Pick one clause and let every point in your talk land on it — the tenth repetition will feel inevitable, not redundant."},
 {gap:"— lesson three passes by: the Munchkin crew out-paddles everyone (“measure a person by the size of their heart, not the size of their flippers”); then the uniform inspections you could never pass —",fn:"The unfairness lesson",fnzh:"接受不公",exact:true,url:"https://youtu.be/pxBQLFLei70?t=590",
  quote:"Sometimes, no matter how well you prepare or how well you perform, you still end up as a sugar cookie. It's just the way life is sometimes. If you want to change the world, get over being a sugar cookie and keep moving forward.",
  craft:"A brutal truth (life is not fair) arrives wearing a pastry's name. The absurd SEAL jargon makes the unfairness sayable — and unforgettable. Naming pain playfully is how you smuggle it past defenses.",
  craftzh:"一条残酷真理(生活不公平)顶着点心的名字进场。荒诞的海豹队黑话让“不公平”变得说得出口、也忘不掉——给痛苦起个俏皮的名字,才能把它偷运过听众的防线。",
  steal:"Borrow the funniest piece of jargon from your world and let it carry your hardest truth."},
 {gap:"— lessons five through eight: the circuses (failure makes you stronger), the record slide-for-life, punch the sharks in the snout, and be your very best in the darkest moment — under the keel of an enemy ship; then Hell Week's mud flats —",fn:"The mud chorus",fnzh:"泥中合唱",exact:true,url:"https://youtu.be/pxBQLFLei70?t=1021",
  quote:"One voice began to echo through the night… and then another, and another. And soon everyone in the class was singing… If you want to change the world, start singing when you're up to your neck in mud.",
  craft:"The emotional peak is a scene, not a statement: freezing mud, one voice, then a chorus. He lets the story climb before the refrain harvests it — the lesson lands pre-agreed.",
  craftzh:"情感的最高点是一个场景,不是一句论断：冰冷的泥滩、一个声音、然后是合唱。先让故事自己爬到顶,副歌再来收割——道理落地时,听众早已同意。",
  steal:"At your emotional peak, narrate; save the moral for after the scene has done its work."},
 {gap:"— the tenth lesson: a brass bell hangs in the center of the compound, for every student to see —",fn:"The refusal",fnzh:"永不摇铃",exact:true,url:"https://youtu.be/pxBQLFLei70?t=1068",
  quote:"All you have to do to quit is ring the bell. Ring the bell and you no longer have to wake up at 5 o'clock. Ring the bell and you no longer have to do the freezing cold swims… If you want to change the world, don't ever, ever ring the bell.",
  craft:"Anaphora inverted into temptation: each “ring the bell” lists what quitting buys you, seductively — so the final refusal (don't ever, ever) has something real to refuse. Build the devil's case before you reject it.",
  craftzh:"首语反复反着用,变成诱惑：每个 ring the bell 都在诱人地列出放弃的好处——最后的拒绝(don't ever, ever)才有真东西可拒绝。先替魔鬼把话说满,再一口回绝。",
  steal:"List the seductions of quitting in the quitter's own voice; your refusal inherits all that weight."},
 {fn:"The recap landing",fnzh:"十课收拢",exact:true,url:"https://youtu.be/pxBQLFLei70?t=1123",
  quote:"Start each day with a task completed. Find someone to help you through life. Respect everyone. Know that life is not fair and that you will fail often… and never, ever give up — if you do these things, then the next generation and the generations that follow will live in a world far better than the one we have today, and what started here will indeed have changed the world.",
  craft:"All ten lessons return in staccato — one clause each, no stories — then the frame closes on the school's slogan. A recap this fast only works because the count was announced at the start.",
  craftzh:"十课以急板重现——一课一个短句,不带故事——然后回到校训收框。收束能这么快,全因开头报过数。",
  steal:"Close a numbered talk with the whole list at one clause per item — the speed is the payoff of the structure."}],
 arc:"Announce the count, anchor on the humblest act, let one refrain close every lesson, hide the hardest truths inside jargon and scenes, invert the refrain into temptation once, then replay all ten in staccato and hand the room back its own slogan.",
 arczh:"先报数,再用最卑微的动作定锚；让同一句副歌合上每一课；把最硬的道理藏进黑话和场景；把副歌反用成诱惑一次；最后十课急板重现,把校训还给全场。"},
{id:"st6",bio:"柯南·奥布莱恩,脱口秀主持人,《辛普森一家》前编剧,哈佛1985级(幽默杂志 Harvard Lampoon 两任社长)。2010年,NBC把《今夜秀》从他手里收走——电视史上最公开的一次解雇。2026年5月,他回到母校做毕业典礼主讲——一个被最公开地炒过鱿鱼的校友,回来讲失败。",speaker:"Conan O'Brien",title:"Conan O'Brien — Harvard Commencement (2026)",sub:"25-minute commencement · 8 beats · fresh from May 2026",hookterm:"the mess around you",hook:"Your greatness comes from the mess around you, not despite it.",hooksrc:"Conan O'Brien, Harvard Commencement (2026)",hookurl:"https://youtu.be/F3fCktnkBbc?t=1437",
 intro:"Twelve minutes of jokes about the room, then a trapdoor: the comedy was load-bearing. The thesis — let your biggest credential become the least important thing about you — arrives with its own upgrade in the final minute.",
 introzh:"前十二分钟全在拿全场开涮,然后活板门一开：那些笑话原来都是承重墙。论点——让你最大的头衔变成关于你最不重要的事——在最后一分钟还自带一次升级。",
 beats:[
 {fn:"The roll-call gag",fnzh:"点名清单",exact:true,url:"https://youtu.be/F3fCktnkBbc?t=0",
  quote:"Trustees, deans, faculty, alumni, graduates, families, my fellow honorands, Justice Department spies, and that Uber Eats driver delivering mimosas.",
  craft:"The ceremonial salutation played straight for seven items, then two absurd ones ride in on the list's momentum. The comic triple, extended: the longer the straight run, the harder the twist lands.",
  craftzh:"礼仪性的称呼语一本正经念了七项,最后两个荒诞条目搭着清单的惯性混进场。加长版喜剧三连：正经铺得越长,反转砸得越重。",
  steal:"Any obligatory list (acknowledgments, agenda) will carry one absurd item at the end — let protocol build your runway."},
 {fn:"Roasting the room",fnzh:"涮全场",exact:true,url:"https://youtu.be/F3fCktnkBbc?t=17",
  quote:"There is no less flattering outfit than the cap and gown. We all look like the potions professor at Hogwarts. Up here on stage, it feels like an AA meeting for druids.",
  craft:"Two analogies for the same target, escalating in specificity — and the target is everyone including himself. Roasting what the whole room is wearing unites rather than divides.",
  craftzh:"同一个靶子给两个类比,具体度递增——而靶子是包括他自己在内的所有人。涮所有人都穿在身上的东西,只会团结全场,不会得罪任何人。",
  steal:"Mock what everyone present shares (the outfit, the venue, the ritual) — inclusive roast, zero victims."},
 {gap:"— eleven minutes of roast elided: President Garber graded C-, Princeton (“absolute tools”), the fish-spaghetti lawsuit, and the “what did foreigners ever add” set piece —",fn:"The trapdoor turn",fnzh:"活板门转折",exact:true,url:"https://youtu.be/F3fCktnkBbc?t=720",
  quote:"I did not come here simply to toss off some jokes about my alma mater. I mean, that was the main reason. But I really do love this school. It changed my life.",
  craft:"The pivot to sincerity contains its own undercut (“that was the main reason”) — he refuses to let the turn feel rehearsed, which is exactly what makes the sincerity that follows credible.",
  craftzh:"转向真诚的那句话里自带一记拆台(“主要还真是为了讲段子”)——不让这个转折显得像排练过的,恰恰因此,后面的真诚才可信。",
  steal:"When you turn serious, undercut the turn itself once — sincerity survives a wink better than a drumroll."},
 {gap:"— the sincerity gets a story: telling his bedridden grandmother he got into Harvard, seeing her weep — “it turned out I was sitting on her leg” —",fn:"The thesis",fnzh:"论点",exact:true,url:"https://youtu.be/F3fCktnkBbc?t=780",
  quote:"On my commencement day, I was content if my Harvard degree was the first thing people knew about me. But what I have found after all these years is that I am fine with Harvard being the last thing anyone knows about me… status, even when it's hard-won, can be double-edged.",
  craft:"First thing / last thing: the whole argument is a positional swap of one word, told as autobiography. At Harvard, to Harvard graduates, on Harvard's dime — the courage of the thesis is the point.",
  craftzh:"first thing / last thing:整个论证就是一个词的位置对调,用自传讲出。在哈佛、对哈佛毕业生、领着哈佛的荣誉学位说这话——说出这个论点的勇气,本身就是重点。",
  steal:"Frame your heresy as biography: I used to want X first; now I prefer X last."},
 {gap:"— the Harvard label was a comedian's death knell (“Late Night with He Thinks He's Better Than You”); his antidote is a set of principles —",fn:"Quote and undercut",fnzh:"引用即拆台",exact:true,url:"https://youtu.be/F3fCktnkBbc?t=903",
  quote:"Walt Whitman wrote, ‘I contain multitudes.’ Well, I contain a breakfast sandwich and an iced coffee from Tatte. But whatever I have achieved has been with the help of an infinitely packed clown car of multitudes.",
  craft:"Cite the canon, deflate it with breakfast, then restate it in his own image (a clown car) — the quotation survives the joke and returns upgraded. Three registers in three sentences.",
  craftzh:"先引经典,再用早餐把它放气,然后用自己的意象(小丑车)重新说一遍——引文经过玩笑没死,反而升级归来。三句话,三个语域。",
  steal:"Quote, deflate, restate in your own metaphor — borrowed wisdom becomes yours on the third beat."},
 {gap:"— the clown car fills: all of Cambridge and half of Austin — “and it really helps to spread the blame around when things go south” —",fn:"The one-adverb failure",fnzh:"一笔带过",exact:true,url:"https://youtu.be/F3fCktnkBbc?t=962",
  quote:"Another thing I learned to do that has saved me repeatedly is to pivot… I famously lost a job that meant the world to me… So at the suggestion of a very smart friend, I started a podcast… I made something I loved just as much if not more than my late-night show.",
  craft:"The Tonight Show catastrophe — the most public firing in television — compressed to “I famously lost a job.” One adverb (famously) does all the acknowledging, and the speed past the wound is itself the lesson.",
  craftzh:"《今夜秀》那场风波——电视史上最公开的解雇——压缩成 I famously lost a job。一个副词(famously)完成全部交代,而这种一带而过的速度,本身就是那一课。",
  steal:"Compress your public failure to one clause with one knowing adverb — dwelling is for the audience to do, not you."},
 {gap:"— principle three: luck (“a lucky poker hand mistaken for brilliance”); “not to renounce accomplishments, but to metabolize them… carry your victories lightly”; then 24 travel shows teach him to let himself be bad at things — ejected from the Van Gogh Museum, “not one person said, now that's a Harvard grad” —",fn:"The quiet diagnosis",fnzh:"安静的诊断",exact:true,url:"https://youtu.be/F3fCktnkBbc?t=1246",
  quote:"Everyone here today has a phone in their pocket that is algorithmically programmed to celebrate you and you alone… but for me, the antidote is quite simple. By deemphasizing what makes us special — in your case, a prized degree — we can really find one another.",
  craft:"The one stretch with no jokes: a diagnosis of the era (engineered narcissism) and a one-line antidote. Placing the only sober paragraph deep in a funny speech gives it the authority of contrast.",
  craftzh:"全篇唯一不埋笑点的段落：给时代下诊断(被算法工程化的自恋),再给一行解药。把唯一严肃的段落深埋在笑声里,对比本身就给了它权威。",
  steal:"In a light talk, budget exactly one sober paragraph — scarcity is what makes it ring."},
 {gap:"— he indicts himself first: a doctorate he didn't earn, dressed like a 12th-century pope, the ego-titles list; decline it? “HELL NO” — grandfather Hoofur said take what you can get and ask for more —",fn:"The upgraded ending",fnzh:"升级收尾",exact:true,url:"https://youtu.be/F3fCktnkBbc?t=1400",
  quote:"So maybe my wish for you is not that Harvard becomes the last thing people know about you, but instead that Harvard becomes the least important thing people know about you… your greatness comes from the mess around you, not despite it.",
  craft:"The callback returns with an edit: last thing → least important thing. He revises his own thesis in real time — the speech ends one notch wiser than its own best line, then lands on “the mess around you.”",
  craftzh:"Callback 带着修订回归：last thing 改成 least important thing。他当场修改自己的论点——演讲结束时比自己最好的一句还高出一格,然后落在 the mess around you 上。",
  steal:"Bring your thesis back at the end, but improved by one word — show the audience the thinking continued."}],
 arc:"A list gag earns the room, roasts unite it, a trapdoor turn cashes twelve minutes of jokes into credibility, one positional swap carries the thesis, quotes get deflated and upgraded, the only sober paragraph diagnoses the era, and the callback returns pre-revised. Comedy as load-bearing structure.",
 arczh:"清单笑话赢得全场,涮众人团结全场；一记活板门转折把十二分钟的笑声兑换成信用；一个词的位置对调扛起论点；引文被放气又升级；唯一严肃的段落给时代下诊断；callback 带着修订归来。喜剧在这里是承重结构。"},
{id:"st7",bio:"J.K.罗琳,《哈利·波特》作者——动笔时是靠救济金生活的单亲母亲,写完时已是世界上最畅销的在世作家之一。2008年6月哈佛毕业典礼:自己大学毕业21年后,她没讲成功,讲了自己一贫如洗的谷底,和想象力的道德责任。",speaker:"J.K. Rowling",title:"J.K. Rowling — The Fringe Benefits of Failure (Harvard, 2008)",sub:"24-minute commencement · 8 beats · the failure narrative, definitively told",hookterm:"rock bottom became the solid foundation",hook:"Rock bottom became the solid foundation on which I rebuilt my life.",hooksrc:"J.K. Rowling, Harvard Commencement (2008)",hookurl:"https://youtu.be/UibfDUPJAEU?t=738",
 intro:"The world's most successful living author spends her Harvard address on the seven years she failed at everything — and builds the whole case in two announced movements: failure, then imagination. Warm self-deprecation up front, a borrowed Roman ending at the close.",
 introzh:"在世作家里最成功的一位,把哈佛演讲全部花在她一败涂地的那七年上——并把论证摆进两个预告好的乐章：失败,然后是想象力。开场用温暖的自嘲破冰,结尾借罗马人落地。",
 beats:[
 {fn:"Opening joke",fnzh:"自嘲破冰",exact:true,url:"https://youtu.be/UibfDUPJAEU?t=211",
  quote:"The first thing I would like to say is thank you. Not only has Harvard given me an extraordinary honour, but the weeks of fear and nausea I have endured at the thought of giving this commencement address have made me lose weight. A win-win situation!",
  craft:"The most famous author alive confesses stage fright in sentence two — vulnerability as the icebreaker, sealed with a corporate cliché (win-win) used with visible irony. Same opening move as Ford and Jobs: hand the room your weakness first.",
  craftzh:"在世最有名的作家,第二句话就承认怯场——用脆弱破冰,再拿一个明显反讽的商务套话(win-win)封口。和 Ford、Jobs 同一开局：先把弱点交给全场。",
  steal:"Confess the nerves of this exact moment, then cash them for a laugh: the stress of preparing this talk has ruined my sleep — a win-win."},
 {gap:"— she steadies herself first: deep breaths, a squint at the red banners, “the world's largest Gryffindor reunion” —",fn:"Managing expectations",fnzh:"降格预告",exact:true,url:"https://youtu.be/UibfDUPJAEU?t=297",
  quote:"The commencement speaker at my own graduation was the distinguished British philosopher Baroness Mary Warnock… it turns out that I cannot remember a single word she said. This liberating discovery enables me to proceed without any fear that I might inadvertently influence you to abandon promising careers in business, the law or politics for the giddy delights of becoming a gay wizard. If all you remember in years to come is the gay wizard joke, I have come out ahead of Baroness Mary Warnock.",
  craft:"She lowers the bar on her own speech — you will forget this, and that is fine — which paradoxically frees the audience to listen. Expectation management as generosity.",
  craftzh:"她亲手降低对这场演讲的期待——你们会忘掉它,没关系——反而让全场放松下来真正去听。管理预期,本质是一种慷慨。",
  steal:"Tell the room what little they will remember — the admission buys attention for everything else."},
 {gap:"— the frame: what do I wish I had known at my own graduation, 21 years ago? She has two answers —",fn:"The two-part map",fnzh:"结构宣告",exact:true,url:"https://youtu.be/UibfDUPJAEU?t=367",
  quote:"I have decided to talk to you about the benefits of failure. And as you stand on the threshold of what is sometimes called real life, I want to extol the crucial importance of imagination.",
  craft:"Two announced movements, each a deliberate paradox for a Harvard audience: failure praised, imagination defended as practical. The map is also the provocation.",
  craftzh:"两个预告好的乐章,对哈佛听众各是一记悖论：赞美失败,为想象力的实用性辩护。地图本身就是挑衅。",
  steal:"Announce two themes and make each one mildly heretical for this particular room."},
 {gap:"— her parents wanted a vocational degree; the moment their car rounded the corner she “ditched German and scuttled off down the Classics corridor” (remember that corridor) —",fn:"The fear swap",fnzh:"恐惧置换",exact:true,url:"https://youtu.be/UibfDUPJAEU?t=541",
  quote:"What I feared most for myself at your age was not poverty, but failure.",
  craft:"One substitution reframes her whole biography: not poverty (the visible hardship) but failure (the internal verdict). One short sentence carries the talk's entire psychology.",
  craftzh:"一次置换重写了她的整部传记：怕的不是贫穷(看得见的苦),而是失败(内心的判决)。一句短句,装下全篇的心理学。",
  steal:"Name what everyone assumes you feared, then swap in what you actually feared."},
 {gap:"— exams had been her only measure of success; you, she notes, may fear failure precisely because “so high have you already flown” —",fn:"The bottom, then the foundation",fnzh:"谷底与地基",exact:true,url:"https://youtu.be/UibfDUPJAEU?t=643",
  quote:"A mere seven years after my graduation day, I had failed on an epic scale… I was jobless, a lone parent, and as poor as it is possible to be in modern Britain, without being homeless. … Rock bottom became the solid foundation on which I rebuilt my life.",
  craft:"The catalogue of ruin is flat and unadorned (jobless, lone parent, poor) — then the architecture metaphor flips the basement into a foundation. The reversal only lands because the inventory before it refused to flinch.",
  craftzh:"废墟的清单平铺直叙、不加修饰(失业、单亲、赤贫)——然后一个建筑隐喻把地下室翻转成地基。这个反转能落地,全因前面的清点毫不闪躲。",
  steal:"Inventory your ruin in flat nouns first; only then are you allowed the redemptive metaphor."},
 {gap:"— what failure taught her, counted plainly: a strong will, more discipline than she had suspected, and friends whose value was “truly above the price of rubies” —",fn:"The definitive sentence",fnzh:"定义句",exact:true,url:"https://youtu.be/UibfDUPJAEU?t=757",
  quote:"It is impossible to live without failing at something, unless you live so cautiously that you might as well not have lived at all — in which case, you fail by default.",
  craft:"The talk's most quoted line is a closed logical loop: avoid failure → fail by default. The trap snaps shut in the final three words. This is periodic-sentence suspense used for argument, not drama.",
  craftzh:"全篇被引用最多的一句是一个闭合的逻辑环：回避失败→缺席即失败。机关在最后三个词处合拢。圆周句的悬念,在这里为论证服务而非抒情。",
  steal:"Build the escape route into a trap: unless you do X — in which case, Y gets you anyway."},
 {gap:"— nine minutes elided: movement two. Imagination as the power to empathize; her Amnesty International years — smuggled letters, the torture survivor who wished her future happiness, a scream behind a closed door; “the willfully unimaginative see more monsters”; Plutarch: what we achieve inwardly will change outer reality —",fn:"The turn outward",fnzh:"向外升华",exact:true,url:"https://youtu.be/UibfDUPJAEU?t=1324",
  quote:"We do not need magic to change the world. We carry all the power we need inside ourselves already: we have the power to imagine better.",
  craft:"The thesis-level use of her own brand happens exactly once, at the moment of maximum leverage — the scattered Potter asides never carry argument weight. Restraint makes the single use enormous.",
  craftzh:"品牌为论点服务只有这一次,而且花在杠杆最大的时刻——散落各处的波特小梗从不承担论证重量。克制让这一次重若千钧。",
  steal:"If you have one famous thing, reference it exactly once, at the summit."},
 {gap:"— one last hope: the friends from her own graduation day, “kind enough not to sue me when I took their names for Death Eaters” — she wishes you friendships like that —",fn:"The borrowed ending",fnzh:"借来的结尾",exact:true,url:"https://youtu.be/UibfDUPJAEU?t=1413",
  quote:"As is a tale, so is life: not how long it is, but how good it is, is what matters. I wish you all very good lives.",
  craft:"Like Jobs with the Whole Earth Catalog, she closes on a collected quotation — Seneca — then adds one warm sentence of her own. The commonplace-book ending, again: the classics do the gravity, you do the blessing. And Seneca is a voice from that Classics corridor she scuttled down at 18 — the early aside, finally cashed.",
  craftzh:"和 Jobs 用《全球概览》一样,她收在一句收藏来的引文上——塞内加——然后补上自己温暖的一句。又一次 commonplace book 式结尾：分量交给经典,祝福留给自己。而塞内加,正来自她 18 岁那年溜进的古典学长廊——开头那句闲笔,在这里兑现。",
  steal:"Close on a borrowed classic plus one plain sentence of your own blessing."}],
 arc:"Confess the nerves, lower the bar, announce two heresies, swap the expected fear for the real one, inventory the ruin flatly, flip the basement into a foundation, spend the brand once at the summit, and let Seneca land the plane. The failure narrative, definitively told.",
 arczh:"先认怯场,再降期待；预告两记离经叛道之论；把人人以为的恐惧换成真实的恐惧；平铺直叙地清点废墟,再把地下室翻成地基；在顶点把自己的品牌兑现一次；最后让塞内加来完成着陆。失败叙事的定版讲法。"},
{id:"st8",bio:"奇玛曼达·恩戈兹·阿迪契,尼日利亚小说家,《半轮黄日》《美国佬》作者。TED 2009《单一故事的危险》:从她自己如何被误读、又如何误读别人讲起——TED上被课堂引用最多的演讲之一,后印成单行本。",speaker:"Chimamanda Ngozi Adichie",title:"Chimamanda Adichie — The Danger of a Single Story (TED, 2009)",sub:"19-minute TED talk · 8 beats",hookterm:"not untrue — incomplete",hook:"The problem with stereotypes is not that they are untrue, but that they are incomplete.",hooksrc:"Chimamanda Ngozi Adichie, TED (2009)",hookurl:"https://youtu.be/D9Ihs241zeg?t=786",
 intro:"She argues against the single story by refusing to tell one: she plays victim, perpetrator, and penitent in her own argument, borrows a word from Igbo to name the mechanism, and lands on a gift. The most structurally honest talk in the TED canon.",
 introzh:"她反对“单一故事”的方式,是拒绝只讲一个故事：在自己的论证里,她轮流扮演受害者、加害者与忏悔者；从伊博语借来一个词命名机制；最后收在一份馈赠上。TED 正典里结构最诚实的一场演讲。",
 beats:[
 {fn:"The two-sentence opening",fnzh:"两句开场",exact:true,url:"https://youtu.be/D9Ihs241zeg?t=8",
  quote:"I'm a storyteller. And I would like to tell you a few personal stories about what I like to call “the danger of the single story.”",
  craft:"Identity in three words, thesis in one sentence — no throat-clearing, and the talk's title is spoken aloud in its second breath. Compare Jobs: the map arrives before the audience can wonder where this is going.",
  craftzh:"三个词报出身份,一句话点出命题——零寒暄,演讲标题在第二口气里被亲口说出。和 Jobs 一样：地图在听众开始疑惑之前就已到手。",
  steal:"Open with who you are in three words, then name your talk's thesis out loud in sentence two."},
 {fn:"The self-exhibit",fnzh:"自证第一案",exact:true,url:"https://youtu.be/D9Ihs241zeg?t=28",
  quote:"All my characters were white and blue-eyed. They played in the snow. They ate apples. And they talked a lot about the weather… My characters also drank a lot of ginger beer — never mind that I had no idea what ginger beer was.",
  craft:"Her first case study of the disease is herself, at seven — a Nigerian child writing snow she had never seen. Ginger beer is the comic detail that makes the colonization of imagination concrete and forgivable at once.",
  craftzh:"这个病的第一个病例是她自己,七岁——一个写雪的尼日利亚孩子,而她从未见过雪。ginger beer 这个喜剧细节,让“想象力被殖民”瞬间变得具体,也瞬间变得可以原谅。",
  steal:"Make yourself the first exhibit of the problem — the audience lowers its defenses when the finger points inward first."},
 {gap:"— Achebe and Camara Laye “saved me from having a single story of what books are”; then Fide: one Saturday, a beautifully woven basket his brother made — it had not occurred to her that his family could make anything —",fn:"The pattern repeats",fnzh:"模式复现",exact:true,url:"https://youtu.be/D9Ihs241zeg?t=198",
  quote:"All I had heard about them was how poor they were… their poverty was my single story of them.",
  craft:"Fide the houseboy: the disease she caught from British books, she now transmits onto a poorer family — the argument advances by showing the pattern is structural, not personal.",
  craftzh:"男仆 Fide:她从英国童书那里染上的病,如今传给了更穷的一家人——论证的推进方式,是证明这个模式是结构性的,不是个人品行问题。",
  steal:"Show the same failure twice — once done to you, once done by you — and it stops being an accusation and becomes a mechanism."},
 {fn:"The mirror",fnzh:"镜像翻转",exact:true,url:"https://youtu.be/D9Ihs241zeg?t=255",
  quote:"My American roommate was shocked by me. She asked where I had learned to speak English so well… She asked if she could listen to what she called my “tribal music,” and was consequently very disappointed when I produced my tape of Mariah Carey.",
  craft:"Now she is on the receiving end — and the weapon is a prop: Mariah Carey. One cassette tape does what a paragraph of indignation could not. Note the register: amused, never wounded.",
  craftzh:"这回轮到她被“单一故事”框住——武器是一件道具：Mariah Carey 的磁带。一盘磁带做到了一整段控诉做不到的事。注意语气：好笑,而非受伤。",
  steal:"When you are the wronged party, reach for the funniest true detail, not the angriest one."},
 {gap:"— the genealogy: the London merchant John Locke, 1561 (“people without heads…”), Kipling's “half devil, half child” — and a professor who ruled her novel “not authentically African”: her characters drove cars, and were not starving —",fn:"The confession",fnzh:"忏悔完成三角",exact:true,url:"https://youtu.be/D9Ihs241zeg?t=546",
  quote:"I remember walking around Guadalajara, watching the people, going to work, rolling up tortillas in the marketplace… I felt overwhelmed with shame. I realized that I had been so immersed in the media coverage of Mexicans that they had become one thing in my mind: the abject immigrant.",
  craft:"Victim, perpetrator — and now penitent. The triangle closes: nobody in the room is exempt, including the speaker at her most celebrated. This confession is what buys the thesis its authority.",
  craftzh:"受害者、加害者——现在是忏悔者。三角闭合：全场无人豁免,包括讲台上最受敬仰的她自己。正是这次忏悔,为论点买来了权威。",
  steal:"Before you indict the room, indict yourself with a specific, dated memory — shame confessed converts to authority."},
 {gap:"— the recipe, stated plainly: show a people as one thing, over and over again, and that is what they become —",fn:"Naming the mechanism",fnzh:"命名机制",exact:true,url:"https://youtu.be/D9Ihs241zeg?t=576",
  quote:"There is a word, an Igbo word, that I think about whenever I think about the power structures of the world, and it is “nkali”… How they are told, who tells them, when they're told, how many stories are told, are really dependent on power. … Start the story with the arrows of the Native Americans, and not with the arrival of the British, and you have an entirely different story.",
  craft:"She borrows a word from her own language to name the invisible force — then proves it with one editing decision: where you START a story determines the story. A whole theory of narrative power in a single cut.",
  craftzh:"她从母语里借来一个词,给看不见的力量命名——然后用一个剪辑决定完成证明：故事从哪里开始,故事就是什么。一整套叙事权力理论,压缩成一次剪辑。",
  steal:"Name your mechanism with a borrowed or coined word, then demonstrate it with one before/after edit."},
 {gap:"— a student says Nigerian men are abusers like her novel's father; she replies that having read American Psycho, it was such a shame young Americans were serial murderers — then her own counter-inventory: refugee camps, a plane crash, jam then margarine then bread vanishing from the table —",fn:"The thesis lands",fnzh:"论点落地",exact:true,url:"https://youtu.be/D9Ihs241zeg?t=786",
  quote:"The single story creates stereotypes, and the problem with stereotypes is not that they are untrue, but that they are incomplete. They make one story become the only story.",
  craft:"The not-X-but-Y correction, aimed at the century's laziest debate: the flaw of a stereotype is incompleteness, not falsehood — which survives fact-checking and changes how you argue forever.",
  craftzh:"一记 not-X-but-Y 修正,对准本世纪最偷懒的辩论：刻板印象的病不在失真,而在不全——这个论断经得起事实核查,并从此改变你论辩的方式。",
  steal:"Aim your critique at incompleteness rather than falsehood — it is the version that cannot be fact-checked away."},
 {gap:"— the cost named (“it robs people of dignity”), then the crescendo: a long “what if my roommate knew…” run — the publisher, the messenger who ordered a sequel, Nollywood, the lawyer — Nigeria's other stories —",fn:"The gift ending",fnzh:"馈赠收尾",exact:true,url:"https://youtu.be/D9Ihs241zeg?t=1051",
  quote:"Stories matter. Many stories matter… when we reject the single story, when we realize that there is never a single story about any place, we regain a kind of paradise.",
  craft:"Two tiny sentences (Stories matter. Many stories matter.) — the thesis compressed to a heartbeat — then the reward is named: not correctness, paradise. She ends by giving the audience something, not asking of them.",
  craftzh:"两个极短的句子(Stories matter. Many stories matter.)——论点压缩成心跳——然后点出报酬：不是“正确”,是乐园。她的结尾是给予听众,而不是要求听众。",
  steal:"Compress your thesis to two tiny sentences near the end, then name what the audience gains — end on the gift."}],
 arc:"Identity, thesis, then a triangle — wronged, wrongdoer, penitent — each corner a personal story; a borrowed word names the mechanism, one editing decision proves it, the not-untrue-but-incomplete correction lands the argument, and paradise pays the audience out. She defeats the single story by structure alone: she never tells one.",
 arczh:"先报身份、点命题,再走完一个三角——受害者、加害者、忏悔者——每个角都是亲身故事；借来的词命名机制,一次剪辑完成证明,“不是失真而是不全”落定论点,最后把“乐园”作为交到听众手里的酬赏。她战胜单一故事的方式是结构本身：她从头到尾没有只讲一个故事。"}
];
const STEAL_OCC={st1:[['opening','humor'],['toast','humor'],['story'],['toast','review','meetings'],['toast','endings'],['endings'],['endings','humor']],
 st2:[['opening','humor'],['opening','review','meetings'],['story','review'],['story','qa'],['review'],['endings','story'],['endings'],['endings','toast']],
 st3:[['opening','humor'],['review','humor'],['qa','meetings'],['humor','story'],['qa','review','meetings'],['story'],['endings']],

function enterUnit(id){inUnit=UNITS.find(u=>u.id===id);const uw=unitWords(inUnit);
  if(inUnit.deck){const un=uw.filter(w=>w._cus?false:!ws(w.id).learned);const pool=un.length?un:uw;inUnit._sess=[...pool].sort(()=>Math.random()-.5).slice(0,20);idx=-1;}
  else if(inUnit.ordered){inUnit._sess=[...uw];idx=(state.upos&&state.upos[id]>0)?state.upos[id]-1:-1;}
  else{
    state.uorder=state.uorder||{};
    let ord=state.uorder[id];
    if(!ord){ord=[...uw].sort(()=>Math.random()-.5).map(w=>w.id);state.uorder[id]=ord;save();}
    const byId={};uw.forEach(w=>byId[w.id]=w);
    inUnit._sess=ord.map(x=>byId[x]).filter(Boolean).concat(uw.filter(w=>!ord.includes(w.id)));
    idx=(state.upos&&state.upos[id]>0)?state.upos[id]-1:-1;
  }
  renderLearn();window.scrollTo(0,0)}
function exitUnit(){inUnit=null;idx=-1;renderLearn()}
function go(i){ if(i<-1)i=-1; idx=i; if(inUnit&&!inUnit.deck){state.upos=state.upos||{};state.upos[inUnit.id]=Math.max(0,idx+1);save();} renderLearn(); window.scrollTo(0,0)}
function learnNext(){
  const u=inUnit,uw=(u._sess||unitWords(u)),w=uw[idx];
  if(!w._cus){const s=ws(w.id);if(!s.learned){s.learned=true;s.iv=0;s.next=today()+2*DAY;addXP(5);bumpStreak();tl().learned++;syncNow();}}
  save();
  if(idx+1<uw.length){go(idx+1);}
  else{
    const area=document.getElementById('learnArea');
    const list=UNITS.filter(x=>!x.tool), i2=list.indexOf(u), nxt=i2>=0?list[i2+1]:null;
    area.innerHTML=`<div class="card done-msg"><div class="big">${u.deck?'Session complete':`${i2>=0?('Unit '+(i2+1)):esc(u.title)} complete`}</div>
      ${(u._sess||u.words).length} ${u.deck?'cards reviewed — '+unitWords(u).length+' in the deck':(REF_UNITS.has(u.id)?'entries reviewed':'entries now in Shuffle')}.<br><br>
      <div class="row">

      </div></div>`;
    if(!u.deck){state.upos=state.upos||{};state.upos[u.id]=0;save();}
    
  }
}

/* ============ PRACTICE (session engine) ============ */
const REF_UNITS=new Set(['u0','uVm','uR','u15']);

const SHUF_SCOPES=[['all','All cards'],['fam','Famous lines'],['star','Focus'],['mine','My Pickups']];
const SCOPE_DESC={all:'Every card in the bank.',fam:'Lines with a real, person-attributed source.',star:'Cards you starred ★.',mine:'Words you added with ＋ (and gifts from friends).'};
let shufCur=null, shufRecent=[];
function cardState(w){ if(w._cus){return state.custom.find(c=>c.id===w.id)||{}; } return ws(w.id); }
function shufAll(){
  const base=ALLWORDS.filter(w=>!REF_UNITS.has(w.unit));
  const cus=state.custom.map(c=>({id:c.id,term:c.term,cat:c.cat||'Words',gloss:c.meaning||'',hard:[],quote:c.example||'',src:(c.gift?'From '+c.gift+' 🎁'+(c.source?' · '+c.source:''):c.source||''),why:c.why||'',whyzh:c.whyzh||'',usage:c.usage||[],_cus:true,unit:'uP'}));
  return base.concat(cus);
}
function shufScope(){const s=state.shufScope||'all';return SHUF_SCOPES.some(p=>p[0]===s)?s:'all';}
function shufPool(){
  const sc=shufScope(); let p=shufAll();
  if(sc==='fam')p=p.filter(w=>hasOrig(w));
  else if(sc==='star')p=p.filter(w=>cardState(w).star);
  else if(sc==='mine')p=p.filter(w=>w.unit==='uP');
  return p;
}
function setShufScope(sc){state.shufScope=sc;save();shufCur=null;shufRecent=[];renderPrac();}
function shufDraw(award){
  const pool=shufPool();
  if(!pool.length){
    const msg={fam:'No famous lines yet.',star:'Nothing starred yet — tap ★ on any card.',mine:'No pickups yet — tap ＋ to add one.'}[shufScope()]||'No cards here yet.';
    document.getElementById('pracArea').innerHTML=`<div class="card done-msg">${msg}</div>`;return;
  }
  let cand=pool.filter(w=>!shufRecent.includes(w.id));
  if(!cand.length){shufRecent=[];cand=pool;}
  const w=cand[Math.floor(Math.random()*cand.length)];
  shufRecent.push(w.id); if(shufRecent.length>12)shufRecent.shift();
  shufCur=w;
  if(award){tl().sessions++; state.reps=(state.reps||0)+1; if(tl().sessions<=30)addXP(5); bumpStreak(); syncNow();} save();
  renderShufCard(); 
}
function shufToggleStar(){ if(!shufCur)return; const st=cardState(shufCur); st.star=!st.star; save(); renderShufCard();  }
function renderShufCard(){
  const w=shufCur, st=cardState(w);
  document.getElementById('pracArea').innerHTML=`<div class="card viewin">

function origUrl(w){
  if(CLIPS[w.id])return CLIPS[w.id];
  const who=(w.src||'').split('—')[0].split(',')[0].replace(/[“”"]/g,'').trim();
  const snippet=toksKeep(w.quote).slice(0,8).join(' ');

function srcClean(s){
  if(!s)return s;

  return s.split(' — ').filter(seg=>!/^(on|from) the /i.test(seg)&&!/^canon supplement/i.test(seg)&&!/^the (Speech Bank|worksheet|course|movers)/i.test(seg)&&!/^whose closing/i.test(seg)&&!/^sampled in/i.test(seg)).join(' · ');
}

async function afDict(term){
  let ipa='',def='',ex='';
  try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(term));
    if(r.ok){const j=await r.json();const e0=j[0]||{};
      ipa=e0.phonetic||(((e0.phonetics||[]).find(p=>p.text)||{}).text)||'';
      const m=(e0.meanings||[])[0]||{};const d=(m.definitions||[])[0]||{};def=d.definition||'';ex=d.example||'';}
  }catch(e){}
  let zh='';
  try{const r2=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(term)+'&langpair=en|zh-CN');
    if(r2.ok){const j2=await r2.json();zh=((j2.responseData||{}).translatedText||'').trim();if(zh.toLowerCase()===term.toLowerCase())zh='';}
  }catch(e){}
  if(!def&&!zh)throw new Error(term.includes(' ')?'the free dictionary has no entry for most phrases':'no dictionary result');
  document.getElementById('fMeaning').value=[ipa,def,zh?('— '+zh):''].filter(Boolean).join(' ');
  if(ex)document.getElementById('fExample').value=ex;
  if(!document.getElementById('fSource').value)document.getElementById('fSource').value='Auto-filled · dictionary';
  const st=document.getElementById('afStatus');

    if(!confirm('Send “'+w.term+'” to '+to+'?')) return;
  }
  const card={term:w.term,gloss:w.gloss||'',quote:w.quote||'',src:w.src||'',why:w.why||'',whyzh:w.whyzh||'',cat:w.cat||'Words',usage:w.usage||[]};
  try{await fetch(SYNC_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:cfg.key,name:cfg.name,action:'gift',to:to,card:card})})}catch(e){return;}
  state.notices=state.notices||[]; state.notices.push('🎁 Sent “'+w.term+'” to '+to+'.'); save();
}
function weekSum(map){if(!map)return 0;const t=today();let s=0;Object.keys(map).forEach(k=>{if(+k>t-7*DAY)s+=(+map[k]||0)});return s;}
function friendsCard(){
  if(!SYNC_URL) return '';
  const cfg=syncCfg();
  if(!cfg) return `<div class="card" style="margin-top:14px"><span class="cat-chip">Friends</span>
    <div style="font-size:13.5px;color:var(--muted);margin:8px 0">Pick a name, enter the circle key.</div>
    <div class="row" style="flex-wrap:wrap;gap:8px"><input id="fsName" class="tin" placeholder="Your name" style="flex:1;min-width:120px"><input id="fsKey" class="tin" placeholder="Circle key" style="flex:1;min-width:120px"><button class="btn primary slim" onclick="joinCircle()">Join</button></div></div>`;
  const fs=window._friends;
  const rows=(fs&&fs.length)?fs.map(m=>{
    const st=m.stats||{}, fresh=st.day===today()&&(st.xp||0)>0;
    const nudged=window._nudged&&window._nudged[m.name];
    return `<div class="tdrow"><div class="tick">${fresh?'🟢':'⚪️'}</div><div style="flex:1"><div class="tt">${esc(m.name)}</div><div class="td">🔥 ${st.streak||0}-day · ⚡ ${fresh?(st.xp||0):0} today · ${st.words||0} words</div></div>${!fresh?`<button class="btn ghost slim" onclick="sendNudge('${esc(m.name)}')" ${nudged?'disabled':''}>${nudged?'👋 Sent':'👋 Nudge'}</button>`:''}</div>`;
  }).join('')+`<div class="td" style="margin-top:10px;color:var(--muted);font-size:13px">This week: you ⚡${weekSum(state.hist)}${fs.map(m=>' · '+esc(m.name)+' ⚡'+weekSum(m.stats&&m.stats.week)).join('')}</div>`:`<div style="font-size:13.5px;color:var(--muted)">No one here yet — share the app link and circle key.</div>`;
  return `<div class="card" style="margin-top:14px"><span class="cat-chip">Friends</span>${rows}</div>`;
}
function resetAll(){
  if(!confirm('Erase all progress — streak, stars, learned marks, reading positions? My Pickups and My Lines are kept. This cannot be undone.'))return;
  state.words={};ALLWORDS.forEach(w=>state.words[w.id]={learned:false,star:false,uses:0,next:0});
  state.xp=0;state.hist={};state.streak=0;state.lastDay=0;state.reps=0;
  state.tl={day:today(),learned:0,sessions:0,line:false};
  state.upos={};state.uorder={};state.stealStars={};window._repDraft='';
  shufCur=null;shufRecent=[];
  save();renderStreak();
  const v=currentView();
  if(v==='today')renderToday(); if(v==='learn'){inSteals=false;inStudy=null;inUnit=null;idx=-1;renderLearn();} if(v==='practice')renderPrac();
}
function currentView(){const b=document.querySelector('nav button.on');return b?b.dataset.v:'learn'}
function switchTo(v){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  ['today','learn','practice'].forEach(k=>document.getElementById('v-'+k).style.display=(k===v)?'block':'none');
  const sec=document.getElementById('v-'+v);sec.classList.remove('viewin');void sec.offsetWidth;sec.classList.add('viewin');
  if(v==='today')renderToday(); if(v==='learn')renderLearn(); if(v==='practice')renderPrac();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.v==='learn'){inLines=false;inSteals=false;inStudy=null;inUnit=null;idx=-1;window._fromSteals=false;}switchTo(b.dataset.v);});


/* init */
renderToday(); renderStreak();  
syncNow(true);
(function(){const el=document.getElementById('v-practice');if(!el||!el.addEventListener)return;let x0=null;
el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
el.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-60)shufDraw(true);},{passive:true});})();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
