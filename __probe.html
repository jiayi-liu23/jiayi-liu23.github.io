<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style-refined.css">
<style>#out{font:12px monospace;white-space:pre;background:#fff;padding:8px}</style>
</head><body>
<main id="m"><p id="p">I am an Assistant Professor of Information Systems and Technology Management at the University of Pittsburgh School of Business. I received my Ph.D. in Information Systems and Operations Management from Emory University.</p></main>
<div id="out"></div>
<script>
document.fonts.ready.then(()=>{
 const p=document.getElementById('p'), m=document.getElementById('m');
 const cs=getComputedStyle(document.body);
 // measure avg char width by rendering an alphabet span
 const s=document.createElement('span');
 s.style.cssText='font:'+cs.fontWeight+' '+cs.fontSize+'/'+cs.lineHeight+' '+cs.fontFamily+';white-space:pre;position:absolute;visibility:hidden';
 s.textContent='I am an Assistant Professor of Information Systems and Technology Management at';
 document.body.appendChild(s);
 const w78=s.getBoundingClientRect().width;
 const cw=w78/78;
 const contentW=m.clientWidth - parseFloat(getComputedStyle(m).paddingLeft)*2;
 // count lines
 const r=new Range(); r.selectNodeContents(p);
 const lines=r.getClientRects().length;
 document.getElementById('out').textContent=
  'viewportW='+window.innerWidth+
  '\nbodyFontSize='+cs.fontSize+' lineHeight='+cs.lineHeight+
  '\nmain.clientWidth='+m.clientWidth+' contentWidth='+contentW.toFixed(1)+
  '\navgCharPx='+cw.toFixed(3)+
  '\nMEASURE_CHARS='+(contentW/cw).toFixed(1)+
  '\nlineBoxes='+lines+
  '\ndocScrollW='+document.documentElement.scrollWidth+' clientW='+document.documentElement.clientWidth;
});
</script></body></html>
